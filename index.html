        function QuickNavigation({ questions, currentQuestion, answers, onQuestionSelect }) {
            const questionsToUse = questions.length > 0 ? questions : QUIZ_CONFIG.questions;
            return (
                <div className="quick-nav-container slide-in">
                    <div className="flex items-center justify-between mb-4">
                        <h3 className="text-lg font-bold text-gray-800">
                            <i className="fas fa-list-ol mr-2 text-indigo-500"></i>Navigation Rapide
                        </h3>
                        <span className="text-sm text-gray-500">{Object.keys(answers).length}/{questionsToUse.length}</span>
                    </div>
                    <div className="grid grid-cols-5 gap-2">
                        {questionsToUse.map((q, index) => {
                            const isAnswered = answers[q.id] !== undefined;
                            const isCurrent = index === currentQuestion;
                            let btnClass = "quick-nav-btn ";
                            if (isCurrent) btnClass += "border-indigo-500 bg-indigo-500 text-white shadow-lg";
                            else if (isAnswered) btnClass += "border-green-500 bg-green-100 text-green-700";
                            else btnClass += "border-gray-300 bg-gray-100 text-gray-600 hover:bg-gray-200";
                            return (
                                <button key={q.id} onClick={() => onQuestionSelect(index)} className={btnClass} title={`Q${index+1}${isAnswered?" (Répondue)":""}`}>
                                    {index + 1}
                                </button>
                            );
                        })}
                    </div>
                    <div className="mt-4 pt-3 border-t border-gray-200">
                        <div className="flex items-center justify-center space-x-4 text-xs text-gray-600">
                            <div className="flex items-center"><div className="w-3 h-3 rounded-full bg-indigo-500 mr-1"></div><span>Actuelle</span></div>
                            <div className="flex items-center"><div className="w-3 h-3 rounded-full bg-green-500 mr-1"></div><span>Répondu</span></div>
                            <div className="flex items-center"><div className="w-3 h-3 rounded-full bg-gray-300 mr-1"></div><span>Non répondu</span></div>
                        </div>
                    </div>
                </div>
            );
        }

        function PythonQuizApp() {
            const [screen, setScreen] = useState('access');
            const [accessCodeInput, setAccessCodeInput] = useState('');
            const [studentInfo, setStudentInfo] = useState({ nom:'', prenom:'', classe:'' });
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(QUIZ_CONFIG.duration);
            const [tabSwitches, setTabSwitches] = useState(0);
            const [warnings, setWarnings] = useState([]);
            const [sessionId, setSessionId] = useState(null);
            const [isBlocked, setIsBlocked] = useState(false);
            const [showDetailedResults, setShowDetailedResults] = useState(false);
            const [shuffledQuestions, setShuffledQuestions] = useState([]);

            useEffect(() => { disableDevTools(); return () => { stopConsoleProtection(); }; }, []);

            useEffect(() => {
                if (screen === 'quiz') startConsoleProtection();
                else stopConsoleProtection();
            }, [screen]);

            useEffect(() => {
                if (screen === 'quiz') {
                    enterFullscreen();
                    const handleEscKey = async (e) => { if (e.key === 'Escape') { e.preventDefault(); await handleFullscreenExit(); } };
                    const handleFSChange = async () => {
                        if (!isFullscreen() && screen === 'quiz') {
                            const allowed = await handleFullscreenExit();
                            if (!allowed) setTimeout(() => { if (!isFullscreen()) enterFullscreen(); }, 100);
                        }
                    };
                    document.addEventListener('keydown', handleEscKey);
                    document.addEventListener('fullscreenchange', handleFSChange);
                    document.addEventListener('webkitfullscreenchange', handleFSChange);
                    document.addEventListener('mozfullscreenchange', handleFSChange);
                    document.addEventListener('MSFullscreenChange', handleFSChange);
                    return () => {
                        document.removeEventListener('keydown', handleEscKey);
                        document.removeEventListener('fullscreenchange', handleFSChange);
                        document.removeEventListener('webkitfullscreenchange', handleFSChange);
                        document.removeEventListener('mozfullscreenchange', handleFSChange);
                        document.removeEventListener('MSFullscreenChange', handleFSChange);
                    };
                } else if (screen === 'results') { exitFullscreen(); }
            }, [screen]);

            useEffect(() => {
                if (screen === 'quiz' && timeLeft > 0 && !isBlocked) {
                    const timer = setInterval(() => {
                        setTimeLeft(prev => { if (prev <= 1) { handleSubmitQuiz(); return 0; } return prev - 1; });
                    }, 1000);
                    return () => clearInterval(timer);
                }
            }, [screen, timeLeft, isBlocked]);

            useEffect(() => {
                if (screen === 'quiz' && !isBlocked) {
                    const handleVisibility = async () => {
                        if (document.hidden) {
                            const newCount = tabSwitches + 1;
                            setTabSwitches(newCount);
                            const warning = `Changement d'onglet à ${formatTime(QUIZ_CONFIG.duration - timeLeft)}`;
                            setWarnings(prev => [...prev, warning]);
                            if (sessionId) {
                                await db.collection('quiz_sessions').doc(sessionId).update({
                                    tabSwitches: newCount, lastWarning: warning,
                                    warnings: firebase.firestore.FieldValue.arrayUnion(warning)
                                });
                            }
                            setIsBlocked(true);
                            const { value: code } = await Swal.fire({
                                icon:'error', title:'⚠️ QUIZ BLOQUÉ !',
                                html:`<div class="text-center"><i class="fas fa-ban text-6xl text-red-500 mb-4"></i>
                                    <p class="text-xl font-bold text-red-600 mb-2">Changement d'onglet détecté !</p>
                                    <p class="text-gray-600 mb-4">Demandez le code de reprise à votre enseignant</p>
                                    <p class="text-sm text-red-500 font-bold">Pénalité : -${QUIZ_CONFIG.penaltyPerWarning} points</p></div>`,
                                input:'password', inputLabel:'Code de déblocage',
                                inputPlaceholder:'Entrez le code fourni',
                                showCancelButton:false, allowOutsideClick:false, allowEscapeKey:false,
                                inputValidator: v => { if (!v) return 'Le code est requis'; }
                            });
                            const h = await hashCode(code);
                            if (h === RECOVERY_CODE_HASH) {
                                setIsBlocked(false);
                                Swal.fire({ icon:'success', title:'Quiz débloqué', text:'Vous pouvez reprendre', timer:2000, showConfirmButton:false });
                            } else {
                                Swal.fire({ icon:'error', title:'Code incorrect', text:'Contactez votre enseignant', allowOutsideClick:false })
                                    .then(() => window.location.reload());
                            }
                        }
                    };
                    document.addEventListener('visibilitychange', handleVisibility);
                    return () => document.removeEventListener('visibilitychange', handleVisibility);
                }
            }, [screen, tabSwitches, timeLeft, isBlocked, sessionId]);

            const formatTime = (s) => `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;

            const handleAccessCodeSubmit = async () => {
                const h = await hashCode(accessCodeInput);
                if (h === ACCESS_CODE_HASH) {
                    setScreen('start');
                    Swal.fire({ icon:'success', title:'Accès autorisé', text:'Entrez vos informations', timer:2000, showConfirmButton:false });
                } else {
                    Swal.fire({ icon:'error', title:'Code incorrect', text:'Vérifiez le code fourni par votre enseignant' });
                }
            };

            const handleStartQuiz = async () => {
                if (!studentInfo.nom || !studentInfo.prenom || !studentInfo.classe) {
                    Swal.fire({ icon:'warning', title:'Informations incomplètes', text:'Veuillez remplir tous les champs' }); return;
                }
                const result = await Swal.fire({
                    icon:'info', title:'Prêt à commencer ?',
                    html:`<div class="text-center">
                        <i class="fas fa-play-circle text-5xl text-indigo-500 mb-4"></i>
                        <p class="text-lg font-semibold mb-1">${studentInfo.prenom} ${studentInfo.nom}</p>
                        <p class="text-gray-500 mb-4">${studentInfo.classe}</p>
                        <div class="bg-yellow-50 rounded-lg p-4 text-left">
                            <p class="font-semibold text-yellow-800 mb-2">⚠️ Règles importantes :</p>
                            <ul class="list-disc list-inside text-sm text-yellow-700 space-y-1">
                                <li>40 minutes - 50 questions</li>
                                <li>Ne pas changer d'onglet</li>
                                <li>-2 points par tentative de triche</li>
                                <li>Mode plein écran obligatoire</li>
                            </ul>
                        </div></div>`,
                    showCancelButton:true, confirmButtonText:'Commencer', cancelButtonText:'Annuler'
                });
                if (result.isConfirmed) {
                    const shuffled = shuffleArray(QUIZ_CONFIG.questions);
                    setShuffledQuestions(shuffled);
                    try {
                        const ref = await db.collection('quiz_sessions').add({
                            etudiant:`${studentInfo.prenom} ${studentInfo.nom}`,
                            classe:studentInfo.classe, status:'started',
                            startTime:firebase.firestore.FieldValue.serverTimestamp(),
                            tabSwitches:0, warnings:[], currentQuestion:0,
                            questionOrder:shuffled.map(q=>q.id)
                        });
                        setSessionId(ref.id);
                    } catch(e) { console.error(e); }
                    setScreen('quiz');
                }
            };

            const handleAnswer = (questionId, answerIndex) => {
                setAnswers(prev => ({ ...prev, [questionId]: answerIndex }));
                if (sessionId) db.collection('quiz_sessions').doc(sessionId).update({ currentQuestion: currentQuestion+1, updatedAt:firebase.firestore.FieldValue.serverTimestamp() });
            };

            const calculateScore = () => {
                const questionsToUse = shuffledQuestions.length > 0 ? shuffledQuestions : QUIZ_CONFIG.questions;
                let totalPoints=0, maxPoints=0, correct=0;
                questionsToUse.forEach(q => {
                    maxPoints += q.points;
                    if (answers[q.id] === q.correct) { totalPoints += q.points; correct++; }
                });
                let noteSur20 = (totalPoints/maxPoints)*20;
                const penalty = tabSwitches * QUIZ_CONFIG.penaltyPerWarning;
                noteSur20 = Math.max(0, noteSur20 - penalty);
                return { correct, total:questionsToUse.length, totalPoints:totalPoints.toFixed(2), maxPoints, noteSur20:noteSur20.toFixed(2), penalty, percentage:((correct/questionsToUse.length)*100).toFixed(2) };
            };

            const handleSubmitQuiz = async () => {
                setScreen('results');
                const results = calculateScore();
                const questionsToUse = shuffledQuestions.length > 0 ? shuffledQuestions : QUIZ_CONFIG.questions;
                const exportData = {
                    etudiant:`${studentInfo.prenom} ${studentInfo.nom}`, classe:studentInfo.classe,
                    note:results.noteSur20, pourcentage:results.percentage,
                    correct:results.correct, total:results.total,
                    points:results.totalPoints, maxPoints:results.maxPoints,
                    tentativesTriche:tabSwitches, penalite:results.penalty,
                    dateTest:new Date().toLocaleString('fr-FR'),
                    timestamp:firebase.firestore.FieldValue.serverTimestamp(),
                    duree:formatTime(QUIZ_CONFIG.duration - timeLeft),
                    avertissements:warnings,
                    detailsReponses:questionsToUse.map(q=>({
                        question:q.id, code:q.code, questionText:q.question,
                        reponse:answers[q.id]!==undefined?answers[q.id]:-1,
                        reponseText:answers[q.id]!==undefined?q.options[answers[q.id]]:"Non répondue",
                        correct:q.correct, correctText:q.options[q.correct],
                        estCorrecte:answers[q.id]===q.correct,
                        points:answers[q.id]===q.correct?q.points:0, difficulte:q.difficulty
                    }))
                };
                try {
                    await db.collection('results').add(exportData);
                    if (sessionId) await db.collection('quiz_sessions').doc(sessionId).update({ status:'completed', endTime:firebase.firestore.FieldValue.serverTimestamp(), finalNote:results.noteSur20 });
                } catch(e) { console.error(e); }
            };

            // ── ÉCRAN ACCÈS ──────────────────────────────────────────────────────────
            if (screen === 'access') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="slide-in glass-effect rounded-3xl shadow-2xl p-8 md:p-12 max-w-md w-full">
                            <div className="text-center mb-8">
                                <div className="inline-flex items-center justify-center w-32 h-32 bg-white bg-opacity-20 rounded-full mb-6 float-animation overflow-hidden p-2">
                                    <img src="isi_logo.png" alt="ISI Keur Massar" className="w-full h-full object-contain" />
                                </div>
                                <h1 className="text-4xl font-bold text-white mb-3">Quiz Python</h1>
                                <p className="text-white text-opacity-90 text-lg mb-1">ISI Keur Massar</p>
                                <p className="text-white text-opacity-70 text-sm">Code d'accès requis</p>
                            </div>
                            <div className="space-y-6">
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        <i className="fas fa-key text-white text-opacity-50"></i>
                                    </div>
                                    <input type="password" value={accessCodeInput} onChange={e=>setAccessCodeInput(e.target.value)} onKeyPress={e=>e.key==='Enter'&&handleAccessCodeSubmit()}
                                        className="w-full pl-12 pr-4 py-4 bg-white bg-opacity-20 border-2 border-white border-opacity-30 rounded-xl text-white text-lg placeholder-white placeholder-opacity-60 focus:outline-none focus:border-opacity-60 transition"
                                        placeholder="Entrez le code d'accès" />
                                </div>
                                <button onClick={handleAccessCodeSubmit} className="w-full bg-white text-indigo-600 py-4 rounded-xl font-bold text-lg hover:bg-opacity-90 transform hover:scale-105 transition-all duration-300 shadow-xl pulse-glow">
                                    <i className="fas fa-unlock mr-2"></i>Accéder au Quiz
                                </button>
                            </div>
                            <div className="mt-8 pt-6 border-t border-white border-opacity-20">
                                <div className="flex items-center justify-center space-x-4 text-white text-opacity-70 text-sm">
                                    <div className="flex items-center"><i className="fas fa-shield-alt mr-2"></i><span>Sécurisé</span></div>
                                    <div className="w-1 h-1 bg-white bg-opacity-50 rounded-full"></div>
                                    <div className="flex items-center"><i className="fas fa-clock mr-2"></i><span>1h</span></div>
                                    <div className="w-1 h-1 bg-white bg-opacity-50 rounded-full"></div>
                                    <div className="flex items-center"><i className="fas fa-question-circle mr-2"></i><span>80 questions</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // ── ÉCRAN INSCRIPTION ────────────────────────────────────────────────────
            if (screen === 'start') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="slide-in bg-white bg-opacity-95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 md:p-12 max-w-lg w-full">
                            <div className="text-center mb-8">
                                <div className="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl mb-6 float-animation">
                                    <i className="fab fa-python text-4xl text-white"></i>
                                </div>
                                <h1 className="text-3xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent mb-2">
                                    {QUIZ_CONFIG.title}
                                </h1>
                                <p className="text-gray-600 flex items-center justify-center gap-4">
                                    <span><i className="far fa-clock mr-1"></i>1 heure</span>
                                    <span><i className="fas fa-question-circle mr-1"></i>80 questions</span>
                                </p>
                            </div>
                            <div className="bg-gradient-to-r from-yellow-50 to-orange-50 border-l-4 border-yellow-500 rounded-xl p-4 mb-6">
                                <div className="flex">
                                    <i className="fas fa-exclamation-triangle text-yellow-600 text-xl mr-3 mt-1"></i>
                                    <div>
                                        <p className="font-bold text-yellow-800 mb-2">Règles importantes</p>
                                        <ul className="text-sm text-yellow-700 space-y-1">
                                            <li>• Ne pas changer d'onglet pendant le quiz</li>
                                            <li>• Le quiz se bloque automatiquement</li>
                                            <li>• Pénalité de 2 points par tentative</li>
                                            <li>• Mode plein écran obligatoire</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                            <div className="space-y-5">
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-2"><i className="fas fa-user mr-2 text-indigo-500"></i>Prénom</label>
                                    <input type="text" value={studentInfo.prenom} onChange={e=>setStudentInfo(prev=>({...prev,prenom:e.target.value}))}
                                        className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" placeholder="Votre prénom" />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-2"><i className="fas fa-id-card mr-2 text-indigo-500"></i>Nom</label>
                                    <input type="text" value={studentInfo.nom} onChange={e=>setStudentInfo(prev=>({...prev,nom:e.target.value}))}
                                        className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" placeholder="Votre nom" />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-2"><i className="fas fa-graduation-cap mr-2 text-indigo-500"></i>Classe</label>
                                    <select value={studentInfo.classe} onChange={e=>setStudentInfo(prev=>({...prev,classe:e.target.value}))}
                                        className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                                        <option value="">Sélectionnez votre classe</option>
                                        <optgroup label="── Licence 1 ──">
                                            <option value="L1-GL">L1 - GL</option>
                                            <option value="L1-IAGE">L1 - IAGE</option>
                                            <option value="L1-RI">L1 - RI</option>
                                            <option value="L1-CS">L1 - CS</option>
                                            <option value="L1-MM">L1 - MM</option>
                                        </optgroup>
                                        <optgroup label="── Licence 2 ──">
                                            <option value="L2-GL">L2 - GL</option>
                                            <option value="L2-IAGE">L2 - IAGE</option>
                                            <option value="L2-CS">L2 - CS</option>
                                            <option value="L2-RI">L2 - RI</option>
                                        </optgroup>
                                    </select>
                                </div>
                                <button onClick={handleStartQuiz}
                                    className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-4 rounded-xl font-bold text-lg hover:from-indigo-600 hover:to-purple-700 transform hover:scale-105 transition-all duration-300 shadow-xl pulse-glow">
                                    <i className="fas fa-rocket mr-2"></i>Commencer le Quiz
                                </button>
                            </div>
                            <div className="mt-8 pt-6 border-t border-gray-200 text-center">
                                <a href="admin.html" className="text-sm text-gray-500 hover:text-indigo-600 transition-colors inline-flex items-center">
                                    <i className="fas fa-user-shield mr-1"></i>Espace administration
                                </a>
                            </div>
                        </div>
                    </div>
                );
            }

            // ── ÉCRAN QUIZ ───────────────────────────────────────────────────────────
            if (screen === 'quiz') {
                const questionsToUse = shuffledQuestions.length > 0 ? shuffledQuestions : QUIZ_CONFIG.questions;
                const question = questionsToUse[currentQuestion];
                const progress = ((currentQuestion+1)/questionsToUse.length)*100;
                const diffColors = {
                    'Facile':'bg-green-100 text-green-700 border-green-300',
                    'Assez Facile':'bg-blue-100 text-blue-700 border-blue-300',
                    'Moyen':'bg-yellow-100 text-yellow-700 border-yellow-300',
                    'Assez Difficile':'bg-orange-100 text-orange-700 border-orange-300',
                    'Difficile':'bg-red-100 text-red-700 border-red-300'
                };
                return (
                    <div className="min-h-screen">
                        {/* Bannière plein écran */}
                        <div className="fixed top-0 left-0 right-0 bg-gradient-to-r from-red-600 to-orange-600 text-white py-2 px-4 z-50 shadow-lg">
                            <div className="flex items-center justify-center gap-3 text-sm font-semibold">
                                <i className="fas fa-expand text-lg"></i>
                                <span>MODE PLEIN ÉCRAN ACTIF</span>
                                <span className="text-xs bg-white bg-opacity-20 px-3 py-1 rounded-full">ESC pour quitter (code requis)</span>
                            </div>
                        </div>

                        {/* Header */}
                        <div className="bg-white bg-opacity-95 backdrop-blur-xl shadow-lg sticky z-40" style={{top:'40px'}}>
                            <div className="max-w-7xl mx-auto px-4 py-4">
                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div className="flex items-center space-x-4">
                                        <div className="w-14 h-14 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                                            <i className="fas fa-user-graduate text-2xl text-white"></i>
                                        </div>
                                        <div>
                                            <h2 className="text-xl font-bold text-gray-800">{studentInfo.prenom} {studentInfo.nom}</h2>
                                            <p className="text-gray-600 text-sm"><i className="fas fa-graduation-cap mr-1"></i>{studentInfo.classe}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        {tabSwitches > 0 && (
                                            <div className="flex items-center bg-red-50 px-4 py-2 rounded-xl border-2 border-red-200">
                                                <i className="fas fa-exclamation-triangle text-red-500 mr-2"></i>
                                                <span className="font-bold text-red-600">{tabSwitches} avertissement(s)</span>
                                            </div>
                                        )}
                                        <div className={`flex items-center gap-3 px-4 py-2 rounded-xl ${timeLeft<600?'bg-red-50 border-2 border-red-200':'bg-indigo-50 border-2 border-indigo-200'}`}>
                                            <i className={`far fa-clock text-2xl ${timeLeft<600?'text-red-500 animate-pulse':'text-indigo-500'}`}></i>
                                            <div>
                                                <div className={`text-2xl font-bold ${timeLeft<600?'text-red-600':'text-gray-800'}`}>{formatTime(timeLeft)}</div>
                                                <div className="text-xs text-gray-500">Temps restant</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="mt-4">
                                    <div className="flex justify-between items-center mb-2">
                                        <span className="text-sm font-semibold text-gray-700"><i className="fas fa-list mr-1"></i>Question {currentQuestion+1} sur {questionsToUse.length}</span>
                                        <div className="flex items-center gap-2">
                                            <span className={`px-3 py-1 rounded-full text-xs font-semibold border-2 ${diffColors[question.difficulty]}`}>{question.difficulty}</span>
                                            <span className="px-3 py-1 rounded-full text-xs font-semibold bg-purple-100 text-purple-700 border-2 border-purple-300"><i className="fas fa-star mr-1"></i>{question.points} pt</span>
                                        </div>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                                        <div className="bg-gradient-to-r from-green-400 via-blue-500 to-purple-600 h-3 rounded-full transition-all duration-500" style={{width:`${progress}%`}}></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Contenu principal */}
                        <div className="flex flex-col lg:flex-row max-w-7xl mx-auto px-4 pt-24 pb-8">
                            <div className="flex-1 lg:pr-8">
                                <div className="slide-in bg-white bg-opacity-95 backdrop-blur-xl rounded-3xl shadow-2xl p-6 md:p-10">
                                    <h3 className="text-2xl md:text-3xl font-bold text-gray-800 mb-8">
                                        <i className="fas fa-code text-indigo-500 mr-3"></i>{question.question}
                                    </h3>
                                    <div className="code-editor rounded-2xl overflow-hidden mb-8 shadow-xl">
                                        <div className="bg-gray-800 px-6 py-3 flex items-center justify-between">
                                            <div className="flex items-center space-x-2">
                                                <div className="w-3 h-3 bg-red-500 rounded-full"></div>
                                                <div className="w-3 h-3 bg-yellow-500 rounded-full"></div>
                                                <div className="w-3 h-3 bg-green-500 rounded-full"></div>
                                            </div>
                                            <div className="flex items-center text-gray-400 text-sm"><i className="fab fa-python mr-2"></i>Python 3</div>
                                        </div>
                                        <div className="bg-gray-900 px-6 py-6">
                                            <pre className="text-green-400 text-base md:text-lg overflow-x-auto">{question.code}</pre>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {question.options.map((option, index) => (
                                            <button key={index} onClick={() => handleAnswer(question.id, index)}
                                                className={`group p-6 rounded-2xl border-2 transition-all duration-300 transform hover:-translate-y-1 ${answers[question.id]===index?'border-indigo-500 bg-gradient-to-r from-indigo-50 to-purple-50 shadow-xl':'border-gray-200 hover:border-indigo-300 hover:shadow-lg bg-white'}`}>
                                                <div className="flex items-center">
                                                    <div className={`w-12 h-12 rounded-xl flex items-center justify-center mr-4 transition-all ${answers[question.id]===index?'bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-lg':'bg-gray-100 text-gray-600 group-hover:bg-indigo-100 group-hover:text-indigo-600'}`}>
                                                        <span className="font-bold text-lg">{String.fromCharCode(65+index)}</span>
                                                    </div>
                                                    <div className="flex-1 text-left"><p className="text-base md:text-lg font-medium text-gray-800">{option}</p></div>
                                                    {answers[question.id]===index && <i className="fas fa-check-circle text-indigo-500 text-2xl"></i>}
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="flex justify-between mt-8">
                                    <button onClick={() => setCurrentQuestion(prev=>Math.max(0,prev-1))} disabled={currentQuestion===0}
                                        className="px-6 py-3 bg-white bg-opacity-90 text-gray-700 rounded-xl font-semibold hover:bg-opacity-100 disabled:opacity-50 disabled:cursor-not-allowed transition shadow-lg flex items-center">
                                        <i className="fas fa-arrow-left mr-2"></i>Précédent
                                    </button>
                                    {currentQuestion < questionsToUse.length-1 ? (
                                        <button onClick={() => setCurrentQuestion(prev=>prev+1)}
                                            className="px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-xl font-semibold hover:from-indigo-600 hover:to-purple-700 transition shadow-lg flex items-center">
                                            Suivant<i className="fas fa-arrow-right ml-2"></i>
                                        </button>
                                    ) : (
                                        <button onClick={handleSubmitQuiz}
                                            className="px-8 py-3 bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-xl font-semibold hover:from-green-600 hover:to-emerald-700 transition shadow-lg flex items-center pulse-glow">
                                            <i className="fas fa-flag-checkered mr-2"></i>Terminer
                                        </button>
                                    )}
                                </div>
                            </div>
                            <div className="lg:w-80 mt-8 lg:mt-0">
                                <QuickNavigation questions={shuffledQuestions} currentQuestion={currentQuestion} answers={answers} onQuestionSelect={i=>setCurrentQuestion(i)} />
                            </div>
                        </div>
                    </div>
                );
            }

            // ── ÉCRAN RÉSULTATS ──────────────────────────────────────────────────────
            if (screen === 'results') {
                const score = calculateScore();
                const isPassed = parseFloat(score.noteSur20) >= 10;
                const questionsToUse = shuffledQuestions.length > 0 ? shuffledQuestions : QUIZ_CONFIG.questions;
                const correctQ = questionsToUse.filter(q => answers[q.id] === q.correct);
                const incorrectQ = questionsToUse.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.correct);
                const unansweredQ = questionsToUse.filter(q => answers[q.id] === undefined);
                return (
                    <div className="min-h-screen py-8 px-4">
                        <div className="max-w-5xl mx-auto">
                            <div className="slide-in bg-white bg-opacity-95 backdrop-blur-xl rounded-3xl shadow-2xl overflow-hidden">
                                <div className={`${isPassed?'bg-gradient-to-r from-green-500 to-emerald-600':'bg-gradient-to-r from-orange-500 to-red-600'} text-white p-8 md:p-12 text-center`}>
                                    <div className="inline-flex items-center justify-center w-28 h-28 bg-white bg-opacity-20 rounded-full mb-6 float-animation">
                                        <i className={`fas ${isPassed?'fa-trophy':'fa-chart-line'} text-5xl`}></i>
                                    </div>
                                    <h1 className="text-4xl md:text-5xl font-bold mb-3">{isPassed?'Félicitations !':'Quiz Terminé'}</h1>
                                    <p className="text-white text-opacity-90 text-lg">{studentInfo.prenom} {studentInfo.nom} • {studentInfo.classe}</p>
                                </div>
                                <div className="p-8 md:p-12">
                                    <div className="text-center mb-12">
                                        <div className="inline-flex items-baseline justify-center mb-4">
                                            <span className="text-7xl md:text-8xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">{score.noteSur20}</span>
                                            <span className="text-4xl text-gray-400 ml-3">/20</span>
                                        </div>
                                        <p className="text-xl text-gray-600 mb-6"><i className="fas fa-check-circle text-green-500 mr-2"></i>{score.correct} réponses correctes sur {score.total}</p>
                                        {score.penalty>0 && (
                                            <div className="inline-flex items-center bg-red-50 px-6 py-3 rounded-2xl border-2 border-red-200 mb-8">
                                                <i className="fas fa-exclamation-triangle text-red-500 mr-2 text-xl"></i>
                                                <span className="text-red-600 font-bold">Pénalité appliquée : -{score.penalty} points</span>
                                            </div>
                                        )}
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
                                        <div className="bg-gradient-to-br from-blue-50 to-blue-100 p-6 rounded-2xl border-2 border-blue-200">
                                            <div className="text-4xl font-bold text-blue-600 mb-2">{score.percentage}%</div>
                                            <div className="text-gray-700 text-sm font-semibold">Taux réussite</div>
                                        </div>
                                        <div className="bg-gradient-to-br from-green-50 to-green-100 p-6 rounded-2xl border-2 border-green-200">
                                            <div className="text-4xl font-bold text-green-600 mb-2">{score.correct}</div>
                                            <div className="text-gray-700 text-sm font-semibold">Correctes</div>
                                        </div>
                                        <div className="bg-gradient-to-br from-red-50 to-red-100 p-6 rounded-2xl border-2 border-red-200">
                                            <div className="text-4xl font-bold text-red-600 mb-2">{incorrectQ.length}</div>
                                            <div className="text-gray-700 text-sm font-semibold">Incorrectes</div>
                                        </div>
                                        <div className="bg-gradient-to-br from-purple-50 to-purple-100 p-6 rounded-2xl border-2 border-purple-200">
                                            <div className="text-4xl font-bold text-purple-600 mb-2">{score.totalPoints}</div>
                                            <div className="text-gray-700 text-sm font-semibold">Points</div>
                                        </div>
                                    </div>
                                    <div className="space-y-4">
                                        <button onClick={() => setShowDetailedResults(!showDetailedResults)}
                                            className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-4 rounded-xl font-bold text-lg hover:from-indigo-600 hover:to-purple-700 transition-all shadow-xl flex items-center justify-center">
                                            <i className={`fas ${showDetailedResults?'fa-eye-slash':'fa-chart-bar'} mr-2`}></i>
                                            {showDetailedResults?'Masquer les détails':'Voir les détails des réponses'}
                                        </button>
                                        <button onClick={() => window.location.reload()}
                                            className="w-full bg-white border-2 border-gray-200 text-gray-700 py-4 rounded-xl font-bold text-lg hover:bg-gray-50 transition-all shadow-lg">
                                            <i className="fas fa-home mr-2"></i>Retour à l'accueil
                                        </button>
                                    </div>
                                    {showDetailedResults && (
                                        <div className="mt-10 space-y-6">
                                            <h3 className="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                                                <i className="fas fa-list-ul mr-3 text-indigo-500"></i>Détails des Réponses
                                            </h3>
                                            {correctQ.length > 0 && (
                                                <div className="bg-green-50 rounded-2xl p-6 border-2 border-green-200">
                                                    <h4 className="text-xl font-bold text-green-700 mb-4 flex items-center"><i className="fas fa-check-circle mr-2"></i>Réponses Correctes ({correctQ.length})</h4>
                                                    <div className="space-y-3">
                                                        {correctQ.map(q => (
                                                            <div key={q.id} className="bg-white rounded-xl p-4 border-l-4 border-green-500">
                                                                <div className="flex justify-between items-start mb-2">
                                                                    <span className="font-semibold text-gray-800">Question {q.id}</span>
                                                                    <span className="bg-green-500 text-white px-3 py-1 rounded-full text-sm font-bold">+{q.points} pts</span>
                                                                </div>
                                                                <p className="text-sm text-gray-700 mb-2">{q.question}</p>
                                                                <div className="bg-gray-900 rounded-lg p-3 mb-2"><pre className="text-green-400 text-xs overflow-x-auto">{q.code}</pre></div>
                                                                <div className="text-sm text-green-600 flex items-center"><i className="fas fa-check mr-2"></i><span><strong>Votre réponse :</strong> {q.options[answers[q.id]]}</span></div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                            {incorrectQ.length > 0 && (
                                                <div className="bg-red-50 rounded-2xl p-6 border-2 border-red-200">
                                                    <h4 className="text-xl font-bold text-red-700 mb-4 flex items-center"><i className="fas fa-times-circle mr-2"></i>Réponses Incorrectes ({incorrectQ.length})</h4>
                                                    <div className="space-y-3">
                                                        {incorrectQ.map(q => (
                                                            <div key={q.id} className="bg-white rounded-xl p-4 border-l-4 border-red-500">
                                                                <div className="flex justify-between items-start mb-3">
                                                                    <span className="font-semibold text-gray-800">Question {q.id}</span>
                                                                    <span className="bg-red-500 text-white px-3 py-1 rounded-full text-sm font-bold">0 pts</span>
                                                                </div>
                                                                <p className="text-sm text-gray-700 mb-3">{q.question}</p>
                                                                <div className="bg-gray-900 rounded-lg p-3 mb-3"><pre className="text-green-400 text-xs overflow-x-auto">{q.code}</pre></div>
                                                                <div className="space-y-2 text-sm">
                                                                    <div className="flex items-center text-red-600"><i className="fas fa-times mr-2"></i><span><strong>Votre réponse :</strong> {q.options[answers[q.id]]}</span></div>
                                                                    <div className="flex items-center text-green-600"><i className="fas fa-check mr-2"></i><span><strong>Bonne réponse :</strong> {q.options[q.correct]}</span></div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                            {unansweredQ.length > 0 && (
                                                <div className="bg-gray-50 rounded-2xl p-6 border-2 border-gray-200">
                                                    <h4 className="text-xl font-bold text-gray-700 mb-4 flex items-center"><i className="fas fa-question-circle mr-2"></i>Non Répondues ({unansweredQ.length})</h4>
                                                    <div className="space-y-3">
                                                        {unansweredQ.map(q => (
                                                            <div key={q.id} className="bg-white rounded-xl p-4 border-l-4 border-gray-400">
                                                                <div className="flex justify-between items-start mb-2">
                                                                    <span className="font-semibold text-gray-800">Question {q.id}</span>
                                                                    <span className="bg-gray-400 text-white px-3 py-1 rounded-full text-sm font-bold">0 pts</span>
                                                                </div>
                                                                <p className="text-sm text-gray-700 mb-2">{q.question}</p>
                                                                <div className="bg-gray-900 rounded-lg p-3 mb-2"><pre className="text-green-400 text-xs overflow-x-auto">{q.code}</pre></div>
                                                                <div className="text-sm text-green-600 flex items-center"><i className="fas fa-check mr-2"></i><span><strong>Bonne réponse :</strong> {q.options[q.correct]}</span></div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PythonQuizApp />);
    </script>
</body>
</html>
