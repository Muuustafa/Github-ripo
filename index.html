*{box-sizing:border-box;}
html,body{background:var(--ink-900);}
body{font-family:var(--font-body);color:var(--text-hi);-webkit-font-smoothing:antialiased;}
::selection{background:var(--py-blue);color:#fff;}
::-webkit-scrollbar{width:10px;height:10px;}

::-webkit-scrollbar-thumb{background:var(--ink-600);border-radius:6px;border:2px solid var(--ink-900);}

.bg-noise-glow{

.caret{display:inline-block;width:.55em;height:1.1em;background:var(--py-yellow);vertical-align:-0.18em;animation:blink 1s step-end infinite;margin-left:2px;}

.fade-up{animation:fadeUp .5s cubic-bezier(.16,.84,.44,1) both;}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.floaty{animation:floaty 4.5s ease-in-out infinite;}
@keyframes spinSlow{from{transform:rotate(0);}to{transform:rotate(360deg);}}
.spin-slow{animation:spinSlow 6s linear infinite;}
@keyframes pulseDot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(87,211,140,.5);}50%{opacity:.6;box-shadow:0 0 0 6px rgba(87,211,140,0);}}
.pulse-dot{animation:pulseDot 1.6s ease-in-out infinite;}
@keyframes barberpole{from{background-position:0 0;}to{background-position:56px 0;}}
.building-bar{
  background-image: repeating-linear-gradient(135deg, var(--py-blue) 0 14px, var(--py-blue-dim) 14px 28px);
  background-size:56px 100%;
  animation: barberpole 1.4s linear infinite;
}

const hashCode = async (code) => {
    const encoder = new TextEncoder();
    const data = encoder.encode(code);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
};

};

        }
    } else { enterFullscreen(); return false; }
};

// ---- Coloration syntaxique légère (Python) ----
const PY_KEYWORDS = new Set(["for","while","if","elif","else","in","True","False","None","break","continue","and","or","not","return","def"]);
const PY_BUILTINS = new Set(["print","int","str","float","bool","len","range","type","sum","max","min","enumerate","sorted"]);

function highlightPython(code) {
    const tokenRe = /(#[^\n]*)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|(\b\d+\.?\d*\b)|([A-Za-z_]\w*)/g;
    const out = [];
    let lastIndex = 0, m, key = 0;
    while ((m = tokenRe.exec(code)) !== null) {
        if (m.index > lastIndex) out.push({ k:key++, cls:'', text: code.slice(lastIndex, m.index) });
        const [full, comment, str, num, word] = m;
        if (comment) out.push({ k:key++, cls:'tok-com', text: full });
        else if (str) out.push({ k:key++, cls:'tok-str', text: full });
        else if (num) out.push({ k:key++, cls:'tok-num', text: full });
        else if (word) {
            if (PY_KEYWORDS.has(word)) out.push({ k:key++, cls:'tok-kw', text: full });
            else if (PY_BUILTINS.has(word)) out.push({ k:key++, cls:'tok-fn', text: full });
            else out.push({ k:key++, cls:'', text: full });
        }
        lastIndex = tokenRe.lastIndex;
    }
    if (lastIndex < code.length) out.push({ k:key++, cls:'', text: code.slice(lastIndex) });
    return out;
}

function CodeBlock({ code, fileName }) {
    const lines = code.split('\n');
    return (
        <div className="rounded-xl overflow-hidden border" style={{borderColor:'var(--line)'}}>
            <div className="flex items-center px-4 py-2" style={{background:'var(--ink-700)', borderBottom:'1px solid var(--line)'}}>
                <div className="flex items-center gap-2">
                    <span className="traffic" style={{background:'#ff6b6b'}}></span>
                    <span className="traffic" style={{background:'#ffc94d'}}></span>
                    <span className="traffic" style={{background:'#57d38c'}}></span>
                </div>
                <span className="ml-4 font-mono text-xs" style={{color:'var(--text-dim)'}}>
                    <i className="fab fa-python mr-1"></i>{fileName || 'exercice.py'}
                </span>
            </div>
            <div className="flex" style={{background:'var(--ink-950)'}}>
                <div className="py-4">
                    {lines.map((_, i) => <div key={i} className="gutter-line px-3 leading-7">{i+1}</div>)}
                </div>
                <pre className="font-mono text-[13px] md:text-[15px] leading-7 py-4 pr-6 overflow-x-auto flex-1" style={{color:'var(--text-hi)'}}>
                    <code>
                        {lines.map((line, i) => (
                            <div key={i}>
                                {highlightPython(line).map(t => t.cls
                                    ? <span key={t.k} className={t.cls}>{t.text}</span>
                                    : <span key={t.k}>{t.text}</span>
                                )}
                                {line === '' ? '\u00A0' : null}
                            </div>
                        ))}
                    </code>
                </pre>
            </div>
        </div>
    );
}

function TerminalBoot({ onDone }) {
    const [lines, setLines] = useState([]);
    const script = [
        "$ python3 -m quiz.access --host isi-keur-massar",
        "Connexion au serveur d'examen...",
        "Session sécurisée établie ✔",
        "En attente du code d'accès..."
    ];
    useEffect(() => {
        let i = 0;
        const t = setInterval(() => {
            if (i < script.length) { setLines(prev => [...prev, script[i]]); i++; }
            else { clearInterval(t); onDone && onDone(); }
        }, 420);
        return () => clearInterval(t);
    }, []);
    return (
        <div className="font-mono text-[12px] md:text-[13px] leading-6" style={{color:'#7fe3a3'}}>
            {lines.map((l,i) => <div key={i}>{l}</div>)}
        </div>
    );
}

function QuickNavigation({ questions, currentQuestion, answers, onQuestionSelect }) {
    return (
        <div className="ide-card fade-up">
            <div className="ide-titlebar px-4 py-3 flex items-center justify-between">
                <h3 className="font-display font-semibold text-sm" style={{color:'var(--text-hi)'}}>
                    <i className="fas fa-list-tree mr-2" style={{color:'var(--py-blue)'}}></i>EXPLORATEUR
                </h3>
                <span className="font-mono text-xs" style={{color:'var(--text-dim)'}}>{Object.keys(answers).length}/{questions.length}</span>
            </div>
            <div className="p-3 grid grid-cols-6 lg:grid-cols-5 gap-1.5 max-h-72 overflow-y-auto">
                {questions.map((q, index) => {
                    const isAnswered = answers[q.id] !== undefined;
                    const isCurrent = index === currentQuestion;
                    let style = { fontFamily:'var(--font-mono)', fontSize:'11.5px', fontWeight:600 };
                    let cls = "rounded-md py-1.5 transition-all border ";
                    if (isCurrent) { cls += ""; style.background='var(--py-blue)'; style.color='#fff'; style.borderColor='#5c96fb'; }
                    else if (isAnswered) { cls += ""; style.background='rgba(87,211,140,.12)'; style.color='#57d38c'; style.borderColor='#245c3c'; }
                    else { cls += ""; style.background='var(--ink-900)'; style.color='var(--text-dim)'; style.borderColor='var(--line)'; }
                    return (
                        <button key={q.id} onClick={() => onQuestionSelect(index)} className={cls} style={style} title={`Q${index+1}${isAnswered?" (répondue)":""}`}>
                            {index + 1}
                        </button>
                    );
                })}
            </div>
            <div className="px-4 pb-4 pt-1 flex items-center justify-center gap-4 text-[11px] font-mono" style={{color:'var(--text-dim)'}}>
                <span className="flex items-center gap-1.5"><span className="minimap-dot" style={{background:'var(--py-blue)'}}></span>Actuelle</span>
                <span className="flex items-center gap-1.5"><span className="minimap-dot" style={{background:'#57d38c'}}></span>Répondue</span>
                <span className="flex items-center gap-1.5"><span className="minimap-dot" style={{background:'var(--line)'}}></span>Vide</span>
            </div>
        </div>
    );
}

function PythonQuizApp() {
    const [screen, setScreen] = useState('access');
    const [bootDone, setBootDone] = useState(false);
    const [accessCodeInput, setAccessCodeInput] = useState('');
    const [accessError, setAccessError] = useState(false);
    const [studentInfo, setStudentInfo] = useState({ nom:'', prenom:'', classe:'' });
    const [currentQuestion, setCurrentQuestion] = useState(0);
    const [answers, setAnswers] = useState({});
    const [timeLeft, setTimeLeft] = useState(QUIZ_CONFIG.duration);
    const [tabSwitches, setTabSwitches] = useState(0);
    const [warnings, setWarnings] = useState([]);
    const [sessionId, setSessionId] = useState(null);
    const [isBlocked, setIsBlocked] = useState(false);
    const [showDetailedResults, setShowDetailedResults] = useState(false);
    const [shuffledQuestions, setShuffledQuestions] = useState([]);
    const [resultFilter, setResultFilter] = useState('all');

    useEffect(() => { disableDevTools(); return () => { stopConsoleProtection(); }; }, []);
    useEffect(() => { if (screen === 'quiz') startConsoleProtection(); else stopConsoleProtection(); }, [screen]);

    useEffect(() => {
        if (screen === 'quiz') {
            enterFullscreen();
            const handleEscKey = async (e) => { if (e.key === 'Escape') { e.preventDefault(); await handleFullscreenExit(); } };
            const handleFSChange = async () => {
                if (!isFullscreen() && screen === 'quiz') {
                    const allowed = await handleFullscreenExit();
                    if (!allowed) setTimeout(() => { if (!isFullscreen()) enterFullscreen(); }, 100);
                }
            };
            document.addEventListener('keydown', handleEscKey);
            document.addEventListener('fullscreenchange', handleFSChange);
            document.addEventListener('webkitfullscreenchange', handleFSChange);
            document.addEventListener('mozfullscreenchange', handleFSChange);
            document.addEventListener('MSFullscreenChange', handleFSChange);
            return () => {
                document.removeEventListener('keydown', handleEscKey);
                document.removeEventListener('fullscreenchange', handleFSChange);
                document.removeEventListener('webkitfullscreenchange', handleFSChange);
                document.removeEventListener('mozfullscreenchange', handleFSChange);
                document.removeEventListener('MSFullscreenChange', handleFSChange);
            };
        } else if (screen === 'results') { exitFullscreen(); }
    }, [screen]);

    useEffect(() => {
        if (screen === 'quiz' && timeLeft > 0 && !isBlocked) {
            const timer = setInterval(() => {
                setTimeLeft(prev => { if (prev <= 1) { handleSubmitQuiz(); return 0; } return prev - 1; });
            }, 1000);
            return () => clearInterval(timer);
        }
    }, [screen, timeLeft, isBlocked]);

    useEffect(() => {
        if (screen === 'quiz' && !isBlocked) {
            const handleVisibility = async () => {
                if (document.hidden) {
                    const newCount = tabSwitches + 1;
                    setTabSwitches(newCount);
                    const warning = `Changement d'onglet à ${formatTime(QUIZ_CONFIG.duration - timeLeft)}`;
                    setWarnings(prev => [...prev, warning]);
                    if (sessionId) {
                        await db.collection('quiz_sessions').doc(sessionId).update({
                            tabSwitches: newCount, lastWarning: warning,
                            warnings: firebase.firestore.FieldValue.arrayUnion(warning)
                        });
                    }
                    setIsBlocked(true);
                    const { value: code } = await Swal.fire({
                        ...swalTheme, icon:'error', title:'QUIZ BLOQUÉ',
                        html:`<div class="text-center">
                            <p class="text-base font-bold mb-2" style="color:#ff6b6b">Changement d'onglet détecté !</p>
                            <p class="text-sm mb-3" style="color:#a9b3c4">Demandez le code de reprise à votre enseignant</p>
                            <p class="text-xs font-bold" style="color:#ff6b6b">Pénalité : -${QUIZ_CONFIG.penaltyPerWarning} points</p></div>`,
                        input:'password', inputLabel:'Code de déblocage',
                        inputPlaceholder:'Entrez le code fourni',
                        showCancelButton:false, allowOutsideClick:false, allowEscapeKey:false,
                        inputValidator: v => { if (!v) return 'Le code est requis'; }
                    });
                    const h = await hashCode(code);
                    if (h === RECOVERY_CODE_HASH) {
                        setIsBlocked(false);
                        Swal.fire({ ...swalTheme, icon:'success', title:'Quiz débloqué', text:'Vous pouvez reprendre', timer:2000, showConfirmButton:false });
                    } else {
                        Swal.fire({ ...swalTheme, icon:'error', title:'Code incorrect', text:'Contactez votre enseignant', allowOutsideClick:false })
                            .then(() => window.location.reload());
                    }
                }
            };
            document.addEventListener('visibilitychange', handleVisibility);
            return () => document.removeEventListener('visibilitychange', handleVisibility);
        }
    }, [screen, tabSwitches, timeLeft, isBlocked, sessionId]);

    const formatTime = (s) => `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;

    const handleAccessCodeSubmit = async () => {
        const h = await hashCode(accessCodeInput);
        if (h === ACCESS_CODE_HASH) {
            setScreen('start');
            Swal.fire({ ...swalTheme, icon:'success', title:'Accès autorisé', text:'Entrez vos informations', timer:1800, showConfirmButton:false });
        } else {
            setAccessError(true);
            setTimeout(() => setAccessError(false), 600);
            Swal.fire({ ...swalTheme, icon:'error', title:'Code incorrect', text:'Vérifiez le code fourni par votre enseignant' });
        }
    };

    const handleStartQuiz = async () => {
        if (!studentInfo.nom || !studentInfo.prenom || !studentInfo.classe) {
            Swal.fire({ ...swalTheme, icon:'warning', title:'Informations incomplètes', text:'Veuillez remplir tous les champs' }); return;
        }
        const result = await Swal.fire({
            ...swalTheme, icon:'info', title:'Prêt à compiler ?',
            html:`<div class="text-left">
                <p class="text-center text-lg font-semibold mb-1" style="color:#eef2f8">${studentInfo.prenom} ${studentInfo.nom}</p>
                <p class="text-center mb-4" style="color:#a9b3c4">${studentInfo.classe}</p>
                <div class="rounded-lg p-4" style="background:#0d1117;border:1px solid #2a3242">
                    <p class="font-semibold mb-2" style="color:#ffc94d">⚠ Règles importantes</p>
                    <ul class="text-sm space-y-1" style="color:#a9b3c4">
                        <li>• 1h30 — 70 questions</li>
                        <li>• Ne pas changer d'onglet</li>
                        <li>• -2 points par tentative de triche</li>
                        <li>• Mode plein écran obligatoire</li>
                    </ul>
                </div></div>`,
            showCancelButton:true, confirmButtonText:'Lancer le quiz', cancelButtonText:'Annuler'
        });
        if (result.isConfirmed) {
            const shuffled = shuffleArray(QUIZ_CONFIG.questions);
            setShuffledQuestions(shuffled);
            try {
                const ref = await db.collection('quiz_sessions').add({
                    etudiant:`${studentInfo.prenom} ${studentInfo.nom}`,
                    classe:studentInfo.classe, status:'started',
                    startTime:firebase.firestore.FieldValue.serverTimestamp(),
                    tabSwitches:0, warnings:[], currentQuestion:0,
                    questionOrder:shuffled.map(q=>q.id)
                });
                setSessionId(ref.id);
            } catch(e) { console.error(e); }
            setScreen('quiz');
        }
    };

    const handleAnswer = (questionId, answerIndex) => {
        setAnswers(prev => ({ ...prev, [questionId]: answerIndex }));
        if (sessionId) db.collection('quiz_sessions').doc(sessionId).update({ currentQuestion: currentQuestion+1, updatedAt:firebase.firestore.FieldValue.serverTimestamp() });
    };

    const calculateScore = () => {
        const questionsToUse = shuffledQuestions.length > 0 ? shuffledQuestions : QUIZ_CONFIG.questions;
        let totalPoints=0, maxPoints=0, correct=0;
        questionsToUse.forEach(q => {
            maxPoints += q.points;
            if (answers[q.id] === q.correct) { totalPoints += q.points; correct++; }
        });
        let noteSur20 = (totalPoints/maxPoints)*20;
        const penalty = tabSwitches * QUIZ_CONFIG.penaltyPerWarning;
        noteSur20 = Math.max(0, noteSur20 - penalty);
        return { correct, total:questionsToUse.length, totalPoints:totalPoints.toFixed(2), maxPoints, noteSur20:noteSur20.toFixed(2), penalty, percentage:((correct/questionsToUse.length)*100).toFixed(2) };
    };

    const handleSubmitQuiz = async () => {
        setScreen('results');
        const results = calculateScore();
        const questionsToUse = shuffledQuestions.length > 0 ? shuffledQuestions : QUIZ_CONFIG.questions;
        const exportData = {
            etudiant:`${studentInfo.prenom} ${studentInfo.nom}`, classe:studentInfo.classe,
            note:results.noteSur20, pourcentage:results.percentage,
            correct:results.correct, total:results.total,
            points:results.totalPoints, maxPoints:results.maxPoints,
            tentativesTriche:tabSwitches, penalite:results.penalty,
            dateTest:new Date().toLocaleString('fr-FR'),
            timestamp:firebase.firestore.FieldValue.serverTimestamp(),
            duree:formatTime(QUIZ_CONFIG.duration - timeLeft),
            avertissements:warnings,
            detailsReponses:questionsToUse.map(q=>({
                question:q.id, code:q.code, questionText:q.question,
                reponse:answers[q.id]!==undefined?answers[q.id]:-1,
                reponseText:answers[q.id]!==undefined?q.options[answers[q.id]]:"Non répondue",
                correct:q.correct, correctText:q.options[q.correct],
                estCorrecte:answers[q.id]===q.correct,
                points:answers[q.id]===q.correct?q.points:0, difficulte:q.difficulty
            }))
        };
        try {
            await db.collection('results').add(exportData);
            if (sessionId) await db.collection('quiz_sessions').doc(sessionId).update({ status:'completed', endTime:firebase.firestore.FieldValue.serverTimestamp(), finalNote:results.noteSur20 });
        } catch(e) { console.error(e); }
    };

    // ── ÉCRAN ACCÈS ──────────────────────────────────────────────
    if (screen === 'access') {
        return (
            <div className="min-h-screen flex items-center justify-center p-4">
                <div className="w-full max-w-lg fade-up">
                    <div className="text-center mb-6">
                        <div className="inline-flex items-center justify-center w-20 h-20 rounded-2xl mb-4 floaty p-2.5" style={{background:'#f4f6fb', border:'1px solid var(--line)'}}>
                            <img src="isi_logo.png" alt="ISI Keur Massar" className="w-full h-full object-contain" />
                        </div>
                        <h1 className="font-display text-3xl md:text-4xl font-bold" style={{color:'var(--text-hi)'}}>Quiz Python</h1>
                        <p className="font-mono text-sm mt-1" style={{color:'var(--text-dim)'}}>ISI Keur Massar — session d'examen sécurisée</p>
                    </div>

                    <div className={`terminal-window overflow-hidden ${accessError?'shake':''}`}>
                        <div className="flex items-center px-4 py-3" style={{background:'var(--ink-800)', borderBottom:'1px solid var(--line)'}}>
                            <span className="traffic mr-2" style={{background:'#ff6b6b'}}></span>
                            <span className="traffic mr-2" style={{background:'#ffc94d'}}></span>
                            <span className="traffic mr-4" style={{background:'#57d38c'}}></span>
                            <span className="font-mono text-xs" style={{color:'var(--text-dim)'}}>bash — quiz-access</span>
                        </div>
                        <div className="p-5 md:p-6">
                            <TerminalBoot onDone={() => setBootDone(true)} />
                            {bootDone && (
                                <div className="fade-up mt-4">
                                    <div className="flex items-center font-mono text-sm mb-3" style={{color:'#7fe3a3'}}>
                                        <span style={{color:'var(--py-blue)'}}>$</span>&nbsp;code_acces&nbsp;=&nbsp;
                                        <span style={{color:'var(--text-dim)'}}>input(</span>
                                        <span className="caret"></span>
                                    </div>
                                    <div className="relative">
                                        <i className="fas fa-key absolute left-3.5 top-1/2 -translate-y-1/2 text-sm" style={{color:'var(--text-dim)'}}></i>
                                        <input type="password" value={accessCodeInput} onChange={e=>setAccessCodeInput(e.target.value)} onKeyPress={e=>e.key==='Enter'&&handleAccessCodeSubmit()}
                                            autoFocus
                                            className="field w-full pl-10 pr-4 py-3 rounded-lg text-sm"
                                            placeholder="entrez le code d'accès..." />
                                    </div>
                                    <button onClick={handleAccessCodeSubmit} className="btn-run w-full mt-4 py-3 rounded-lg flex items-center justify-center gap-2">
                                        <i className="fas fa-play"></i> Exécuter
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="mt-6 flex items-center justify-center gap-5 font-mono text-xs" style={{color:'var(--text-dim)'}}>
                        <span><i className="fas fa-shield-halved mr-1.5" style={{color:'var(--ok)'}}></i>Sécurisé</span>
                        <span><i className="far fa-clock mr-1.5" style={{color:'var(--py-yellow)'}}></i>1h30</span>
                        <span><i className="fas fa-code mr-1.5" style={{color:'var(--py-blue)'}}></i>70 questions</span>
                    </div>
                </div>
            </div>
        );
    }

    // ── ÉCRAN INSCRIPTION ────────────────────────────────────────
    if (screen === 'start') {
        return (
            <div className="min-h-screen flex items-center justify-center p-4">
                <div className="ide-card w-full max-w-xl fade-up overflow-hidden">
                    <div className="ide-titlebar px-5 py-3.5 flex items-center justify-between">
                        <div className="flex items-center gap-2">
                            <span className="traffic" style={{background:'#ff6b6b'}}></span>
                            <span className="traffic" style={{background:'#ffc94d'}}></span>
                            <span className="traffic" style={{background:'#57d38c'}}></span>
                            <span className="font-mono text-xs ml-3" style={{color:'var(--text-dim)'}}>nouveau_projet.py</span>
                        </div>
                        <span className="chip diff-Moyen">setup</span>
                    </div>
                    <div className="p-6 md:p-8">
                        <div className="text-center mb-6">
                            <div className="inline-flex items-center justify-center w-14 h-14 rounded-xl mb-3 p-2" style={{background:'#f4f6fb', border:'1px solid var(--line)'}}>
                                <img src="isi_logo.png" alt="ISI Keur Massar" className="w-full h-full object-contain" />
                            </div>
                            <h1 className="font-display text-2xl font-bold" style={{color:'var(--text-hi)'}}>{QUIZ_CONFIG.title}</h1>
                            <p className="font-mono text-xs mt-2" style={{color:'var(--text-dim)'}}>
                                <i className="far fa-clock mr-1"></i>1h30 &nbsp;·&nbsp; <i className="fas fa-code mr-1"></i>70 questions
                            </p>
                        </div>

                        <div className="rounded-xl p-4 mb-6" style={{background:'rgba(255,201,77,.08)', border:'1px solid #8a6d1f'}}>
                            <p className="font-semibold text-sm mb-2 flex items-center" style={{color:'var(--py-yellow)'}}>
                                <i className="fas fa-triangle-exclamation mr-2"></i>Règles importantes
                            </p>
                            <ul className="text-sm space-y-1" style={{color:'var(--text-mid)'}}>
                                <li>• Ne pas changer d'onglet pendant le quiz</li>
                                <li>• Le quiz se bloque automatiquement en cas d'infraction</li>
                                <li>• Pénalité de 2 points par tentative</li>
                                <li>• Mode plein écran obligatoire</li>
                            </ul>
                        </div>

                        <div className="space-y-4">
                            <div>
                                <label className="block font-mono text-xs mb-1.5" style={{color:'var(--text-dim)'}}>prenom =</label>
                                <input type="text" value={studentInfo.prenom} onChange={e=>setStudentInfo(prev=>({...prev,prenom:e.target.value}))}
                                    className="field w-full px-4 py-3 rounded-lg text-sm" placeholder='"Votre prénom"' />
                            </div>
                            <div>
                                <label className="block font-mono text-xs mb-1.5" style={{color:'var(--text-dim)'}}>nom =</label>
                                <input type="text" value={studentInfo.nom} onChange={e=>setStudentInfo(prev=>({...prev,nom:e.target.value}))}
                                    className="field w-full px-4 py-3 rounded-lg text-sm" placeholder='"Votre nom"' />
                            </div>
                            <div>
                                <label className="block font-mono text-xs mb-1.5" style={{color:'var(--text-dim)'}}>classe =</label>
                                <select value={studentInfo.classe} onChange={e=>setStudentInfo(prev=>({...prev,classe:e.target.value}))}
                                    className="field w-full px-4 py-3 rounded-lg text-sm">
                                    <option value="">Sélectionnez votre classe</option>
                                    <optgroup label="Licence 1">
                                        <option value="L1-GL">L1 - GL</option>
                                        <option value="L1-IAGE">L1 - IAGE</option>
                                        <option value="L1-RI">L1 - RI</option>
                                        <option value="L1-CS">L1 - CS</option>
                                        <option value="L1-MM">L1 - MM</option>
                                    </optgroup>
                                    <optgroup label="Licence 2">
                                        <option value="L2-GL">L2 - GL</option>
                                        <option value="L2-IAGE">L2 - IAGE</option>
                                        <option value="L2-CS">L2 - CS</option>
                                        <option value="L2-RI">L2 - RI</option>
                                    </optgroup>
                                </select>
                            </div>
                            <button onClick={handleStartQuiz} className="btn-primary w-full py-3.5 rounded-lg flex items-center justify-center gap-2 text-sm">
                                <i className="fas fa-rocket"></i> Lancer le Quiz
                            </button>
                        </div>

                        <div className="mt-6 pt-5 text-center" style={{borderTop:'1px solid var(--line)'}}>
                            <a href="admin.html" className="font-mono text-xs hover:underline" style={{color:'var(--text-dim)'}}>
                                <i className="fas fa-user-shield mr-1"></i>espace administration
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    // ── ÉCRAN QUIZ ───────────────────────────────────────────────
    if (screen === 'quiz') {
        const questionsToUse = shuffledQuestions.length > 0 ? shuffledQuestions : QUIZ_CONFIG.questions;
        const question = questionsToUse[currentQuestion];
        const progress = ((currentQuestion+1)/questionsToUse.length)*100;
        const fileName = CATEGORY_FILE[question.category] || 'exercice.py';
        return (
            <div className="min-h-screen pb-16">
                <div className="fixed top-0 left-0 right-0 z-50 px-4 py-1.5 text-center font-mono text-[11px]" style={{background:'var(--py-blue-dim)', color:'#dfeaff', borderBottom:'1px solid #3a5da0'}}>
                    <i className="fas fa-expand mr-1.5"></i>MODE PLEIN ÉCRAN ACTIF &nbsp;·&nbsp; <span style={{color:'#9fc0f5'}}>ESC pour quitter (code requis)</span>
                </div>

                <div className="sticky z-40" style={{top:'28px'}}>
                    <div className="ide-card mx-2 md:mx-6 mt-3 overflow-hidden" style={{borderRadius:'12px'}}>
                        <div className="px-4 md:px-6 py-3 flex flex-wrap items-center justify-between gap-3" style={{background:'var(--ink-800)'}}>
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-lg flex items-center justify-center" style={{background:'var(--py-blue-dim)'}}>
                                    <i className="fas fa-user-graduate" style={{color:'#dfeaff'}}></i>
                                </div>
                                <div>
                                    <p className="font-semibold text-sm" style={{color:'var(--text-hi)'}}>{studentInfo.prenom} {studentInfo.nom}</p>
                                    <p className="font-mono text-[11px]" style={{color:'var(--text-dim)'}}>{studentInfo.classe}</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                {tabSwitches > 0 && (
                                    <span className="chip" style={{color:'#ff6b6b',borderColor:'#7a2b2b',background:'rgba(255,107,107,.1)'}}>
                                        <i className="fas fa-triangle-exclamation mr-1"></i>{tabSwitches} avert.
                                    </span>
                                )}
                                <div className="flex items-center gap-2 px-3 py-1.5 rounded-lg" style={{background: timeLeft<600?'rgba(255,107,107,.12)':'var(--ink-900)', border:`1px solid ${timeLeft<600?'#7a2b2b':'var(--line)'}`}}>
                                    <i className={`far fa-clock ${timeLeft<600?'':''}`} style={{color: timeLeft<600?'#ff6b6b':'var(--py-blue)'}}></i>
                                    <span className="font-mono font-bold text-sm" style={{color: timeLeft<600?'#ff6b6b':'var(--text-hi)'}}>{formatTime(timeLeft)}</span>
                                </div>
                            </div>
                        </div>
                        <div className="px-4 md:px-6 pt-3 pb-3.5" style={{background:'var(--ink-800)', borderTop:'1px solid var(--line-soft)'}}>
                            <div className="flex items-center justify-between mb-2 font-mono text-[11px]" style={{color:'var(--text-dim)'}}>
                                <span>Question {currentQuestion+1} / {questionsToUse.length}</span>
                                <div className="flex items-center gap-2">
                                    <span className={`chip diff-${question.difficulty.replace(' ','.')}`}>{question.difficulty}</span>
                                    <span className="chip" style={{color:'var(--purple)',borderColor:'#4a3f6b',background:'rgba(179,157,219,.08)'}}>{question.points} pt</span>
                                </div>
                            </div>
                            <div className="w-full h-1.5 rounded-full overflow-hidden" style={{background:'var(--ink-900)'}}>
                                <div className="h-full building-bar rounded-full transition-all duration-500" style={{width:`${progress}%`}}></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div className="max-w-7xl mx-auto px-2 md:px-6 mt-5 flex flex-col lg:flex-row gap-5">
                    <div className="flex-1">
                        <div className="ide-card fade-up overflow-hidden">
                            <div className="p-5 md:p-8">
                                <h3 className="font-display text-lg md:text-xl font-semibold mb-5" style={{color:'var(--text-hi)'}}>
                                    <span className="font-mono text-sm mr-2" style={{color:'var(--text-dim)'}}>&gt;&gt;&gt;</span>{question.question}
                                </h3>
                                <CodeBlock code={question.code} fileName={fileName} />
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-6">
                                    {question.options.map((option, index) => (
                                        <button key={index} onClick={() => handleAnswer(question.id, index)}
                                            className={`opt-card p-4 flex items-center gap-3 ${answers[question.id]===index?'selected':''}`}>
                                            <div className="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0 font-mono font-bold text-sm"
                                                style={{ background: answers[question.id]===index ? 'var(--py-blue)' : 'var(--ink-900)', color: answers[question.id]===index ? '#fff' : 'var(--text-dim)', border: answers[question.id]===index ? 'none' : '1px solid var(--line)'}}>
                                                {String.fromCharCode(65+index)}
                                            </div>
                                            <code className="font-mono text-sm flex-1" style={{color:'var(--text-hi)'}}>{option}</code>
                                            {answers[question.id]===index && <i className="fas fa-circle-check" style={{color:'var(--py-blue)'}}></i>}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                        <div className="flex justify-between mt-5">
                            <button onClick={() => setCurrentQuestion(prev=>Math.max(0,prev-1))} disabled={currentQuestion===0}
                                className="btn-ghost px-5 py-3 rounded-lg font-medium text-sm flex items-center disabled:opacity-40">
                                <i className="fas fa-arrow-left mr-2"></i>Précédent
                            </button>
                            {currentQuestion < questionsToUse.length-1 ? (
                                <button onClick={() => setCurrentQuestion(prev=>prev+1)} className="btn-primary px-6 py-3 rounded-lg font-medium text-sm flex items-center">
                                    Suivant<i className="fas fa-arrow-right ml-2"></i>
                                </button>
                            ) : (
                                <button onClick={handleSubmitQuiz} className="btn-run px-7 py-3 rounded-lg text-sm flex items-center">
                                    <i className="fas fa-flag-checkered mr-2"></i>Terminer &amp; Soumettre
                                </button>
                            )}
                        </div>
                    </div>
                    <div className="lg:w-80">
                        <QuickNavigation questions={questionsToUse} currentQuestion={currentQuestion} answers={answers} onQuestionSelect={i=>setCurrentQuestion(i)} />
                    </div>
                </div>

                <div className="fixed bottom-0 left-0 right-0 status-bar px-4 py-1.5 flex items-center justify-between font-mono text-[11px] z-40" style={{color:'#dfeaff'}}>
                    <span><i className="fab fa-python mr-1.5"></i>Python 3.12</span>
                    <span className="hide-mobile">UTF-8 · LF</span>
                    <span>{Object.keys(answers).length}/{questionsToUse.length} répondues</span>
                </div>
            </div>
        );
    }

    // ── ÉCRAN RÉSULTATS (rapport façon pytest) ─────────────────────
    if (screen === 'results') {
        const score = calculateScore();
        const isPassed = parseFloat(score.noteSur20) >= 10;
        const questionsToUse = shuffledQuestions.length > 0 ? shuffledQuestions : QUIZ_CONFIG.questions;
        const correctQ = questionsToUse.filter(q => answers[q.id] === q.correct);
        const incorrectQ = questionsToUse.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.correct);
        const unansweredQ = questionsToUse.filter(q => answers[q.id] === undefined);
        const filterList = resultFilter==='ok'?correctQ:resultFilter==='fail'?incorrectQ:resultFilter==='skip'?unansweredQ:questionsToUse;

        return (
            <div className="min-h-screen py-6 md:py-10 px-3 md:px-4">
                <div className="max-w-4xl mx-auto space-y-5">

                    <div className="terminal-window overflow-hidden fade-up">
                        <div className="flex items-center px-4 py-3" style={{background:'var(--ink-800)', borderBottom:'1px solid var(--line)'}}>
                            <span className="traffic mr-2" style={{background:'#ff6b6b'}}></span>
                            <span className="traffic mr-2" style={{background:'#ffc94d'}}></span>
                            <span className="traffic mr-4" style={{background:'#57d38c'}}></span>
                            <span className="font-mono text-xs" style={{color:'var(--text-dim)'}}>bash — rapport_examen</span>
                        </div>
                        <div className="p-5 md:p-7 font-mono text-[12.5px] md:text-sm leading-7">
                            <p style={{color:'var(--text-dim)'}}>$ python3 -m pytest quiz_{studentInfo.nom.toLowerCase()||'etudiant'}.py -v</p>
                            <p className="mt-2" style={{color:'var(--py-blue)'}}>{"=".repeat(18)} session d'examen {"=".repeat(18)}</p>
                            <p style={{color:'var(--text-mid)'}}>étudiant : <span style={{color:'var(--text-hi)'}}>{studentInfo.prenom} {studentInfo.nom}</span> · classe : <span style={{color:'var(--text-hi)'}}>{studentInfo.classe}</span></p>
                            <p style={{color:'var(--text-mid)'}}>collected {score.total} items</p>
                            <p className="mt-2">
                                <span style={{color:'#57d38c'}}>{score.correct} passed</span>
                                {incorrectQ.length>0 && <span style={{color:'#ff6b6b'}}>, {incorrectQ.length} failed</span>}
                                {unansweredQ.length>0 && <span style={{color:'var(--text-dim)'}}>, {unansweredQ.length} skipped</span>}
                                <span style={{color:'var(--text-dim)'}}> in {formatTime(QUIZ_CONFIG.duration - timeLeft)}</span>
                            </p>
                            {score.penalty>0 && <p className="mt-1" style={{color:'#ff9f5b'}}>⚠ pénalité anti-triche appliquée : -{score.penalty} pts ({tabSwitches} infraction{tabSwitches>1?'s':''})</p>}
                            <p className="mt-4 text-lg font-bold" style={{color: isPassed?'#57d38c':'#ff6b6b'}}>
                                NOTE FINALE : {score.noteSur20} / 20 {isPassed ? '✔ ADMIS' : '✘ NON ADMIS'}
                            </p>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 fade-up">
                        {[
                            {label:'Réussite', value:score.percentage+'%', color:'var(--py-blue)'},
                            {label:'Correctes', value:score.correct, color:'#57d38c'},
                            {label:'Incorrectes', value:incorrectQ.length, color:'#ff6b6b'},
                            {label:'Points', value:score.totalPoints, color:'var(--purple)'},
                        ].map((s,i) => (
                            <div key={i} className="ide-card p-4 text-center">
                                <div className="font-display text-2xl md:text-3xl font-bold" style={{color:s.color}}>{s.value}</div>
                                <div className="font-mono text-[11px] mt-1" style={{color:'var(--text-dim)'}}>{s.label}</div>
                            </div>
                        ))}
                    </div>

                    <div className="flex flex-col sm:flex-row gap-3 fade-up">
                        <button onClick={() => setShowDetailedResults(!showDetailedResults)} className="btn-primary flex-1 py-3.5 rounded-lg text-sm flex items-center justify-center gap-2">
                            <i className={`fas ${showDetailedResults?'fa-eye-slash':'fa-list-check'}`}></i>
                            {showDetailedResults?'Masquer le détail':'Voir le détail des réponses'}
                        </button>
                        <button onClick={() => window.location.reload()} className="btn-ghost flex-1 py-3.5 rounded-lg text-sm">
                            <i className="fas fa-house mr-2"></i>Retour à l'accueil
                        </button>
                    </div>

                    {showDetailedResults && (
                        <div className="space-y-3 fade-up">
                            <div className="flex flex-wrap gap-2">
                                {[
                                    {k:'all', label:`Toutes (${questionsToUse.length})`},
                                    {k:'ok', label:`Réussies (${correctQ.length})`},
                                    {k:'fail', label:`Échouées (${incorrectQ.length})`},
                                    {k:'skip', label:`Ignorées (${unansweredQ.length})`},
                                ].map(f => (
                                    <button key={f.k} onClick={()=>setResultFilter(f.k)}
                                        className="px-3.5 py-1.5 rounded-full font-mono text-xs border transition-all"
                                        style={resultFilter===f.k ? {background:'var(--py-blue)', color:'#fff', borderColor:'#5c96fb'} : {background:'var(--ink-800)', color:'var(--text-dim)', borderColor:'var(--line)'}}>
                                        {f.label}
                                    </button>
                                ))}
                            </div>
                            {filterList.map(q => {
                                const given = answers[q.id];
                                const ok = given === q.correct;
                                const skipped = given === undefined;
                                const cls = skipped ? 'assert-skip' : ok ? 'assert-ok' : 'assert-fail';
                                return (
                                    <div key={q.id} className={`ide-card ${cls} p-4 md:p-5`}>
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="font-mono text-xs" style={{color:'var(--text-dim)'}}>test_question_{q.id}</span>
                                            <span className="font-mono text-xs font-bold" style={{color: skipped?'var(--text-dim)':ok?'#57d38c':'#ff6b6b'}}>
                                                {skipped ? 'SKIPPED' : ok ? `PASSED +${q.points}pt` : 'FAILED'}
                                            </span>
                                        </div>
                                        <p className="text-sm mb-3" style={{color:'var(--text-mid)'}}>{q.question}</p>
                                        <div className="rounded-lg p-3 mb-3 overflow-x-auto" style={{background:'var(--ink-950)'}}>
                                            <pre className="font-mono text-xs" style={{color:'var(--text-hi)'}}>{q.code}</pre>
                                        </div>
                                        <div className="font-mono text-xs space-y-1">
                                            {!skipped && <div style={{color: ok?'#57d38c':'#ff6b6b'}}>votre réponse &nbsp;→&nbsp; {q.options[given]}</div>}
                                            {(!ok) && <div style={{color:'#57d38c'}}>attendu &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→&nbsp; {q.options[q.correct]}</div>}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            </div>
        );
    }
    return null;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PythonQuizApp />);
</script>
</body>
</html>
