        function AdminDashboard() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [results, setResults] = useState([]);
            const [activeSessions, setActiveSessions] = useState([]);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [showDetailedAnswers, setShowDetailedAnswers] = useState(false);
            const [filterStatus, setFilterStatus] = useState('all');
            const [filterClasse, setFilterClasse] = useState('all');
            const [sidebarOpen, setSidebarOpen] = useState(true);

            useEffect(() => {
                if (isAuthenticated) {
                    const u1 = db.collection('results').orderBy('timestamp','desc').onSnapshot(snap => {
                        setResults(snap.docs.map(d => ({ id:d.id, ...d.data() })));
                    });
                    const u2 = db.collection('quiz_sessions').where('status','in',['started']).onSnapshot(snap => {
                        setActiveSessions(snap.docs.map(d => ({ id:d.id, ...d.data() })));
                    });
                    return () => { u1(); u2(); };
                }
            }, [isAuthenticated]);

            const handleLogin = () => {
                if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
                    setIsAuthenticated(true);
                    Swal.fire({ icon:'success', title:'Connexion réussie', text:'Bienvenue dans le tableau de bord', timer:2000, showConfirmButton:false });
                } else {
                    Swal.fire({ icon:'error', title:'Identifiants incorrects', text:"Vérifiez vos identifiants" });
                }
            };

            const handleLogout = () => {
                Swal.fire({ icon:'question', title:'Déconnexion', text:'Voulez-vous vous déconnecter ?', showCancelButton:true, confirmButtonText:'Oui', cancelButtonText:'Annuler' })
                    .then(r => { if (r.isConfirmed) { setIsAuthenticated(false); setUsername(''); setPassword(''); } });
            };

            const exportToCSV = () => {
                const headers = ['Nom','Classe','Note/20','Pourcentage','Bonnes réponses','Total','Points','Max points','Triche','Pénalité','Date'];
                const rows = results.map(r => [r.etudiant,r.classe,r.note,r.pourcentage+'%',r.correct,r.total,r.points,r.maxPoints,r.tentativesTriche,r.penalite||0,r.dateTest]);
                const csv = '\uFEFF' + [headers,...rows].map(row=>row.join(',')).join('\n');
                const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href=url; a.download=`resultats_quiz_${new Date().toISOString().split('T')[0]}.csv`; a.click();
            };

            const clearAllResults = async () => {
                const r = await Swal.fire({
                    icon:'warning', title:'Attention !',
                    html:`<p class="text-lg font-semibold mb-2">Êtes-vous sûr ?</p><p class="text-gray-600">Suppression de <strong>${results.length} résultats</strong></p><p class="text-red-600 text-sm mt-2">Action irréversible !</p>`,
                    showCancelButton:true, confirmButtonText:'Oui, supprimer tout', cancelButtonText:'Annuler', confirmButtonColor:'#ef4444'
                });
                if (r.isConfirmed) {
                    try {
                        const batch = db.batch();
                        const snap = await db.collection('results').get();
                        snap.docs.forEach(d => batch.delete(d.ref));
                        await batch.commit();
                        Swal.fire({ icon:'success', title:'Supprimé !', text:'Tous les résultats ont été effacés', timer:2000, showConfirmButton:false });
                    } catch(e) { Swal.fire({ icon:'error', title:'Erreur', text:'Impossible de supprimer les résultats' }); }
                }
            };

            const calculateStats = () => {
                if (results.length === 0) return { total:0, moyenne:0, tauxReussite:0, tentativesTriche:0 };
                const total = results.length;
                const moyenne = (results.reduce((acc,r) => acc+parseFloat(r.note),0)/total).toFixed(2);
                const admis = results.filter(r => parseFloat(r.note) >= 10).length;
                const tauxReussite = ((admis/total)*100).toFixed(2);
                const tentativesTriche = results.reduce((acc,r) => acc+(r.tentativesTriche||0),0);
                return { total, moyenne, tauxReussite, tentativesTriche };
            };

            const filteredResults = results.filter(r => {
                const sm = filterStatus==='all'||(filterStatus==='admis'&&parseFloat(r.note)>=10)||(filterStatus==='echec'&&parseFloat(r.note)<10)||(filterStatus==='triche'&&r.tentativesTriche>0);
                const cm = filterClasse==='all'||r.classe===filterClasse;
                return sm && cm;
            });

            // ── CONNEXION ────────────────────────────────────────────────────────────
            if (!isAuthenticated) {
                return (
                    <div className="gradient-bg min-h-screen flex items-center justify-center p-4">
                        <div className="glass-effect rounded-3xl shadow-2xl p-8 md:p-12 max-w-md w-full">
                            <div className="text-center mb-8">
                                <div className="inline-flex items-center justify-center w-24 h-24 bg-white bg-opacity-20 rounded-full mb-6 float-animation">
                                    <i className="fas fa-shield-alt text-5xl text-white"></i>
                                </div>
                                <h1 className="text-4xl font-bold text-white mb-3">Administration</h1>
                                <p className="text-white text-opacity-90 text-lg">Quiz Python - ISI Keur Massar</p>
                            </div>
                            <div className="space-y-5">
                                <div>
                                    <label className="block text-white text-sm font-semibold mb-2"><i className="fas fa-user mr-2"></i>Nom d'utilisateur</label>
                                    <input type="text" value={username} onChange={e=>setUsername(e.target.value)} onKeyPress={e=>e.key==='Enter'&&handleLogin()}
                                        className="w-full px-4 py-3 bg-white bg-opacity-20 border-2 border-white border-opacity-30 rounded-xl text-white placeholder-white placeholder-opacity-60 focus:outline-none focus:border-opacity-60 transition"
                                        placeholder="Identifiant" />
                                </div>
                                <div>
                                    <label className="block text-white text-sm font-semibold mb-2"><i className="fas fa-lock mr-2"></i>Mot de passe</label>
                                    <input type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyPress={e=>e.key==='Enter'&&handleLogin()}
                                        className="w-full px-4 py-3 bg-white bg-opacity-20 border-2 border-white border-opacity-30 rounded-xl text-white placeholder-white placeholder-opacity-60 focus:outline-none focus:border-opacity-60 transition"
                                        placeholder="Mot de passe" />
                                </div>
                                <button onClick={handleLogin} className="w-full bg-white text-indigo-600 py-4 rounded-xl font-bold text-lg hover:bg-opacity-90 transform hover:scale-105 transition-all duration-300 shadow-xl pulse-glow">
                                    <i className="fas fa-sign-in-alt mr-2"></i>Se connecter
                                </button>
                            </div>
                            <div className="mt-8 pt-6 border-t border-white border-opacity-20 text-center">
                                <a href="index.html" className="text-white text-opacity-70 hover:text-opacity-100 transition-colors inline-flex items-center">
                                    <i className="fas fa-arrow-left mr-2"></i>Retour au quiz
                                </a>
                            </div>
                        </div>
                    </div>
                );
            }

            const stats = calculateStats();

            // ── TABLEAU DE BORD ──────────────────────────────────────────────────────
            return (
                <div className="flex min-h-screen bg-gray-50">
                    {/* SIDEBAR */}
                    <div className={`${sidebarOpen?'w-64':'w-20'} bg-gradient-to-b from-indigo-800 to-purple-900 text-white transition-all duration-300 fixed h-full z-10 shadow-2xl`}>
                        <div className="p-6">
                            <div className="flex items-center justify-between mb-8">
                                {sidebarOpen && <div><h2 className="text-2xl font-bold">Admin</h2><p className="text-white text-opacity-70 text-sm">ISI Keur Massar</p></div>}
                                <button onClick={()=>setSidebarOpen(!sidebarOpen)} className="p-2 hover:bg-white hover:bg-opacity-10 rounded-lg transition">
                                    <i className={`fas fa-${sidebarOpen?'times':'bars'} text-xl`}></i>
                                </button>
                            </div>
                            <nav className="space-y-2">
                                <div className="px-4 py-3 bg-white bg-opacity-20 rounded-xl flex items-center space-x-3 cursor-pointer hover:bg-opacity-30 transition">
                                    <i className="fas fa-chart-bar text-xl"></i>{sidebarOpen&&<span className="font-semibold">Statistiques</span>}
                                </div>
                                <div className="px-4 py-3 hover:bg-white hover:bg-opacity-10 rounded-xl flex items-center space-x-3 cursor-pointer transition">
                                    <i className="fas fa-users text-xl"></i>{sidebarOpen&&<span>Sessions actives</span>}
                                </div>
                                <div onClick={exportToCSV} className="px-4 py-3 hover:bg-white hover:bg-opacity-10 rounded-xl flex items-center space-x-3 cursor-pointer transition">
                                    <i className="fas fa-file-export text-xl"></i>{sidebarOpen&&<span>Exporter CSV</span>}
                                </div>
                                <div onClick={clearAllResults} className="px-4 py-3 hover:bg-white hover:bg-opacity-10 rounded-xl flex items-center space-x-3 cursor-pointer transition">
                                    <i className="fas fa-trash text-xl"></i>{sidebarOpen&&<span>Effacer tout</span>}
                                </div>
                                <div onClick={handleLogout} className="px-4 py-3 hover:bg-red-500 hover:bg-opacity-20 rounded-xl flex items-center space-x-3 cursor-pointer transition">
                                    <i className="fas fa-sign-out-alt text-xl"></i>{sidebarOpen&&<span>Déconnexion</span>}
                                </div>
                            </nav>
                        </div>
                    </div>

                    {/* CONTENU */}
                    <div className={`flex-1 ${sidebarOpen?'ml-64':'ml-20'} transition-all duration-300`}>
                        <main className="p-8">
                            <div className="mb-8">
                                <h1 className="text-4xl font-bold text-gray-800 mb-2">Tableau de Bord</h1>
                                <p className="text-gray-600">Quiz Python ISI Keur Massar — Gestion des résultats</p>
                            </div>

                            {/* STATS PRINCIPALES */}
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                                {[
                                    {label:'Total Étudiants', value:stats.total, icon:'fa-users', from:'from-blue-400', to:'to-blue-600'},
                                    {label:'Moyenne Générale', value:stats.moyenne, icon:'fa-chart-line', from:'from-green-400', to:'to-green-600'},
                                    {label:'Taux de Réussite', value:stats.tauxReussite+'%', icon:'fa-percentage', from:'from-purple-400', to:'to-purple-600'},
                                    {label:'Tentatives Triche', value:stats.tentativesTriche, icon:'fa-exclamation-triangle', from:'from-red-400', to:'to-red-600'},
                                ].map((s,i) => (
                                    <div key={i} className="bg-white rounded-2xl shadow-lg p-6 hover:shadow-xl transition-all transform hover:-translate-y-1">
                                        <div className="flex items-center justify-between mb-4">
                                            <div className={`w-14 h-14 bg-gradient-to-br ${s.from} ${s.to} rounded-xl flex items-center justify-center shadow-lg`}>
                                                <i className={`fas ${s.icon} text-2xl text-white`}></i>
                                            </div>
                                            <span className="text-3xl font-bold text-gray-800">{s.value}</span>
                                        </div>
                                        <h3 className="text-gray-600 font-semibold">{s.label}</h3>
                                    </div>
                                ))}
                            </div>

                            {/* STATS DÉTAILLÉES */}
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center"><i className="fas fa-graduation-cap mr-2 text-indigo-500"></i>Par Classe</h3>
                                    <div className="space-y-2 max-h-48 overflow-y-auto">
                                        {CLASSES.map(c => (
                                            <div key={c} className="flex justify-between items-center">
                                                <span className="text-gray-600 text-sm">{c}</span>
                                                <span className="font-bold text-indigo-600">{results.filter(r=>r.classe===c).length}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center"><i className="fas fa-trophy mr-2 text-yellow-500"></i>Résultats</h3>
                                    <div className="space-y-3">
                                        <div className="flex justify-between items-center"><span className="text-gray-600">Admis (≥10)</span><span className="font-bold text-green-600">{results.filter(r=>parseFloat(r.note)>=10).length}</span></div>
                                        <div className="flex justify-between items-center"><span className="text-gray-600">Échec (&lt;10)</span><span className="font-bold text-red-600">{results.filter(r=>parseFloat(r.note)<10).length}</span></div>
                                    </div>
                                </div>
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center"><i className="fas fa-star mr-2 text-purple-500"></i>Performances</h3>
                                    <div className="space-y-3">
                                        <div className="flex justify-between items-center"><span className="text-gray-600">Note max</span><span className="font-bold text-green-600">{results.length>0?Math.max(...results.map(r=>parseFloat(r.note))).toFixed(2):'0'}/20</span></div>
                                        <div className="flex justify-between items-center"><span className="text-gray-600">Note min</span><span className="font-bold text-red-600">{results.length>0?Math.min(...results.map(r=>parseFloat(r.note))).toFixed(2):'0'}/20</span></div>
                                    </div>
                                </div>
                            </div>

                            {/* SESSIONS ACTIVES */}
                            {activeSessions.length > 0 && (
                                <div className="bg-gradient-to-r from-green-50 to-emerald-50 rounded-2xl shadow-lg p-6 mb-8 border-2 border-green-200">
                                    <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center">
                                        <span className="relative flex h-3 w-3 mr-3">
                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                            <span className="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                                        </span>
                                        Sessions en cours ({activeSessions.length})
                                        <span className="ml-3 text-sm bg-green-500 text-white px-3 py-1 rounded-full">EN DIRECT</span>
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {activeSessions.map(s => (
                                            <div key={s.id} className="bg-white rounded-xl p-4 shadow border-l-4 border-green-500">
                                                <div className="flex items-center mb-2">
                                                    <div className="w-10 h-10 bg-gradient-to-br from-green-400 to-emerald-500 rounded-full flex items-center justify-center mr-3"><i className="fas fa-user text-white"></i></div>
                                                    <div><p className="font-bold text-gray-800">{s.etudiant}</p><p className="text-sm text-gray-600">{s.classe}</p></div>
                                                </div>
                                                <div className="flex justify-between text-sm">
                                                    <span className="text-gray-600">Question {s.currentQuestion}/50</span>
                                                    {s.tabSwitches>0&&<span className="bg-red-100 text-red-600 px-2 py-1 rounded-full text-xs font-bold">{s.tabSwitches} ⚠️</span>}
                                                </div>
                                                <span className="inline-flex items-center text-xs text-green-600 font-semibold mt-2">
                                                    <span className="pulse-dot w-2 h-2 bg-green-500 rounded-full mr-2"></span>En cours
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* FILTRES */}
                            <div className="bg-white rounded-2xl shadow-lg p-6 mb-6">
                                <h3 className="text-lg font-bold text-gray-800 mb-4">Filtres</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">Par Statut</label>
                                        <div className="flex flex-wrap gap-2">
                                            {['all','admis','echec','triche'].map(s => (
                                                <button key={s} onClick={()=>setFilterStatus(s)}
                                                    className={`px-4 py-2 rounded-xl font-semibold transition-all ${filterStatus===s?'bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-lg':'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                                                    {s==='all'?'Tous':s==='admis'?'Admis':s==='echec'?'Échec':'Triche'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">Par Classe</label>
                                        <div className="flex flex-wrap gap-2">
                                            <button onClick={()=>setFilterClasse('all')} className={`px-4 py-2 rounded-xl font-semibold transition-all ${filterClasse==='all'?'bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-lg':'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>Toutes</button>
                                            {CLASSES.map(c => (
                                                <button key={c} onClick={()=>setFilterClasse(c)}
                                                    className={`px-4 py-2 rounded-xl font-semibold transition-all ${filterClasse===c?'bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-lg':'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                                                    {c}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* TABLEAU */}
                            <div className="bg-white rounded-2xl shadow-lg overflow-hidden">
                                <div className="p-6 bg-gradient-to-r from-indigo-500 to-purple-600">
                                    <h3 className="text-2xl font-bold text-white flex items-center"><i className="fas fa-table mr-3"></i>Résultats des Étudiants ({filteredResults.length})</h3>
                                </div>
                                {filteredResults.length === 0 ? (
                                    <div className="p-12 text-center">
                                        <i className="fas fa-inbox text-6xl text-gray-300 mb-4"></i>
                                        <p className="text-xl text-gray-500 font-semibold">Aucun résultat disponible</p>
                                        <p className="text-gray-400 mt-2">Les résultats apparaîtront ici après soumission des quiz</p>
                                    </div>
                                ) : (
                                    <div className="overflow-x-auto">
                                        <table className="w-full">
                                            <thead className="bg-gray-50 sticky top-0">
                                                <tr>
                                                    {['Étudiant','Classe','Note','Performance','Surveillance','Date','Actions'].map((h,i) => (
                                                        <th key={i} className="px-6 py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">{h}</th>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody className="bg-white divide-y divide-gray-200">
                                                {filteredResults.map((result,index) => (
                                                    <tr key={index} className="hover:bg-indigo-50 transition-all">
                                                        <td className="px-6 py-4 whitespace-nowrap">
                                                            <div className="flex items-center">
                                                                <div className="w-10 h-10 bg-gradient-to-br from-indigo-400 to-purple-500 rounded-full flex items-center justify-center mr-3 shadow-md"><i className="fas fa-user text-white"></i></div>
                                                                <div className="font-semibold text-gray-800">{result.etudiant}</div>
                                                            </div>
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-nowrap">
                                                            <span className="px-3 py-1 inline-flex text-sm font-bold rounded-full bg-indigo-100 text-indigo-700">{result.classe}</span>
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-nowrap">
                                                            <div className={`text-2xl font-bold ${parseFloat(result.note)>=10?'text-green-600':'text-red-600'}`}>{result.note}/20</div>
                                                            <div className="text-xs text-gray-500">{result.correct}/{result.total} bonnes</div>
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-nowrap">
                                                            <div className="w-32">
                                                                <div className="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                                                                    <div className="bg-gradient-to-r from-green-400 to-green-600 h-3 rounded-full" style={{width:`${result.pourcentage}%`}}></div>
                                                                </div>
                                                                <div className="text-xs font-semibold text-gray-700 mt-1">{result.pourcentage}%</div>
                                                            </div>
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-nowrap">
                                                            {result.tentativesTriche>0
                                                                ? <div className="flex items-center text-red-600 font-bold"><i className="fas fa-exclamation-triangle mr-2"></i>{result.tentativesTriche} fois</div>
                                                                : <span className="text-green-600 font-semibold flex items-center"><i className="fas fa-check-circle mr-2"></i>Aucune</span>}
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-600"><i className="far fa-clock mr-1"></i>{result.dateTest}</td>
                                                        <td className="px-6 py-4 whitespace-nowrap text-sm">
                                                            <button onClick={()=>setSelectedStudent(result)} className="text-indigo-600 hover:text-indigo-800 font-bold flex items-center hover:underline">
                                                                <i className="fas fa-eye mr-2"></i>Détails
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        </main>
                    </div>

                    {/* MODAL DÉTAILS */}
                    {selectedStudent && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-5xl w-full max-h-[90vh] overflow-hidden">
                                <div className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-6">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <h2 className="text-3xl font-bold mb-1">{selectedStudent.etudiant}</h2>
                                            <p className="text-white text-opacity-90">{selectedStudent.classe}</p>
                                        </div>
                                        <button onClick={()=>{setSelectedStudent(null);setShowDetailedAnswers(false);}} className="text-white hover:bg-white hover:bg-opacity-20 rounded-full p-2 transition">
                                            <i className="fas fa-times text-2xl"></i>
                                        </button>
                                    </div>
                                </div>
                                <div className="p-8 overflow-y-auto" style={{maxHeight:'calc(90vh - 120px)'}}>
                                    <div className="text-center mb-8">
                                        <div className={`inline-block ${parseFloat(selectedStudent.note)>=10?'bg-gradient-to-br from-green-500 to-emerald-600':'bg-gradient-to-br from-red-500 to-orange-600'} rounded-2xl p-6 shadow-2xl mb-4`}>
                                            <div className="flex items-baseline justify-center gap-2">
                                                <span className="text-7xl font-bold text-white">{selectedStudent.note}</span>
                                                <span className="text-4xl text-white opacity-90">/20</span>
                                            </div>
                                        </div>
                                        <p className="text-gray-600 text-lg">{selectedStudent.correct} / {selectedStudent.total} réponses correctes</p>
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                                        {[
                                            {label:'Réussite', value:selectedStudent.pourcentage+'%', color:'blue'},
                                            {label:'Correctes', value:selectedStudent.correct, color:'green'},
                                            {label:'Durée', value:selectedStudent.duree||'N/A', color:'purple'},
                                            {label:'Triches', value:selectedStudent.tentativesTriche, color:'red'},
                                        ].map((s,i) => (
                                            <div key={i} className={`bg-gradient-to-br from-${s.color}-50 to-${s.color}-100 p-5 rounded-2xl text-center border-2 border-${s.color}-200`}>
                                                <div className={`text-3xl font-bold text-${s.color}-600 mb-1`}>{s.value}</div>
                                                <div className="text-sm text-gray-700 font-semibold">{s.label}</div>
                                            </div>
                                        ))}
                                    </div>

                                    {showDetailedAnswers && selectedStudent.detailsReponses && (
                                        <div className="space-y-6 mb-8">
                                            <h4 className="text-2xl font-bold text-gray-800 flex items-center"><i className="fas fa-list-ul mr-3 text-indigo-500"></i>Analyse Détaillée</h4>
                                            {(() => {
                                                const correct = selectedStudent.detailsReponses.filter(r=>r.estCorrecte);
                                                const incorrect = selectedStudent.detailsReponses.filter(r=>!r.estCorrecte&&r.reponse!==-1);
                                                const unanswered = selectedStudent.detailsReponses.filter(r=>r.reponse===-1);
                                                const renderCard = (detail, type) => {
                                                    const q = QUIZ_CONFIG.questions.find(quest=>quest.id===detail.question);
                                                    const colors = {correct:'green', incorrect:'red', unanswered:'gray'};
                                                    const c = colors[type];
                                                    return (
                                                        <div key={detail.question} className={`bg-white rounded-xl p-4 border-l-4 border-${c}-500`}>
                                                            <div className="flex justify-between items-start mb-2">
                                                                <span className="font-semibold text-gray-800">Question {detail.question}</span>
                                                                <span className={`bg-${c}-500 text-white px-3 py-1 rounded-full text-sm font-bold`}>{type==='correct'?`+${detail.points} pts`:'0 pts'}</span>
                                                            </div>
                                                            {q && (<>
                                                                <p className="text-sm text-gray-700 mb-2">{q.question}</p>
                                                                <div className="bg-gray-900 rounded-lg p-3 mb-2"><pre className="text-green-400 text-xs overflow-x-auto">{q.code}</pre></div>
                                                                {type==='correct'&&<div className="text-sm text-green-600 flex items-center"><i className="fas fa-check mr-2"></i><span><strong>Votre réponse :</strong> {detail.reponseText}</span></div>}
                                                                {type==='incorrect'&&<div className="space-y-1 text-sm">
                                                                    <div className="flex items-center text-red-600"><i className="fas fa-times mr-2"></i><span><strong>Votre réponse :</strong> {detail.reponseText}</span></div>
                                                                    <div className="flex items-center text-green-600"><i className="fas fa-check mr-2"></i><span><strong>Bonne réponse :</strong> {detail.correctText}</span></div>
                                                                </div>}
                                                                {type==='unanswered'&&<div className="text-sm text-green-600 flex items-center"><i className="fas fa-check mr-2"></i><span><strong>Bonne réponse :</strong> {detail.correctText}</span></div>}
                                                            </>)}
                                                        </div>
                                                    );
                                                };
                                                return (<>
                                                    {correct.length>0&&<div className="bg-green-50 rounded-2xl p-6 border-2 border-green-200">
                                                        <h5 className="text-xl font-bold text-green-700 mb-4 flex items-center"><i className="fas fa-check-circle mr-2"></i>Correctes ({correct.length})</h5>
                                                        <div className="space-y-3">{correct.map(d=>renderCard(d,'correct'))}</div>
                                                    </div>}
                                                    {incorrect.length>0&&<div className="bg-red-50 rounded-2xl p-6 border-2 border-red-200">
                                                        <h5 className="text-xl font-bold text-red-700 mb-4 flex items-center"><i className="fas fa-times-circle mr-2"></i>Incorrectes ({incorrect.length})</h5>
                                                        <div className="space-y-3">{incorrect.map(d=>renderCard(d,'incorrect'))}</div>
                                                    </div>}
                                                    {unanswered.length>0&&<div className="bg-gray-50 rounded-2xl p-6 border-2 border-gray-200">
                                                        <h5 className="text-xl font-bold text-gray-700 mb-4 flex items-center"><i className="fas fa-question-circle mr-2"></i>Non Répondues ({unanswered.length})</h5>
                                                        <div className="space-y-3">{unanswered.map(d=>renderCard(d,'unanswered'))}</div>
                                                    </div>}
                                                </>);
                                            })()}
                                        </div>
                                    )}

                                    <div className="flex flex-col sm:flex-row gap-3 mt-6">
                                        <button onClick={()=>setShowDetailedAnswers(!showDetailedAnswers)}
                                            className="flex-1 bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-4 rounded-xl font-bold text-lg hover:from-indigo-600 hover:to-purple-700 transition-all shadow-lg flex items-center justify-center">
                                            <i className={`fas ${showDetailedAnswers?'fa-eye-slash':'fa-chart-bar'} mr-2`}></i>
                                            {showDetailedAnswers?'Masquer':'Voir'} les détails
                                        </button>
                                        <button onClick={() => {
                                            const rpt = `=== RAPPORT DÉTAILLÉ ===\n\nÉtudiant: ${selectedStudent.etudiant}\nClasse: ${selectedStudent.classe}\nNote: ${selectedStudent.note}/20\nRéussite: ${selectedStudent.pourcentage}%\nRéponses correctes: ${selectedStudent.correct}/${selectedStudent.total}\nDurée: ${selectedStudent.duree}\nTentatives triche: ${selectedStudent.tentativesTriche}\nDate: ${selectedStudent.dateTest}`;
                                            const blob = new Blob([rpt], {type:'text/plain;charset=utf-8;'});
                                            const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`rapport_${selectedStudent.etudiant.replace(/\s+/g,'_')}.txt`; a.click();
                                        }} className="flex-1 bg-gradient-to-r from-blue-500 to-cyan-600 text-white py-4 rounded-xl font-bold text-lg hover:from-blue-600 hover:to-cyan-700 transition-all shadow-lg flex items-center justify-center">
                                            <i className="fas fa-file-export mr-2"></i>Exporter
                                        </button>
                                        <button onClick={()=>{setSelectedStudent(null);setShowDetailedAnswers(false);}} className="px-8 bg-gray-200 text-gray-700 py-4 rounded-xl font-bold text-lg hover:bg-gray-300 transition-all">Fermer</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminDashboard />);
    </script>
</body>
</html>
