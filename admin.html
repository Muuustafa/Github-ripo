.ide-card{background:var(--ink-800); border:1px solid var(--line); border-radius:14px;}
.field{background:var(--ink-900); border:1px solid var(--line); color:var(--text-hi); font-family:var(--font-mono);}
.field:focus{outline:none;border-color:var(--py-blue);box-shadow:0 0 0 3px rgba(79,140,247,.18);}
.field::placeholder{color:var(--text-dim);}
.btn-primary{background:linear-gradient(180deg, var(--py-blue), #3a6fd6); color:#fff;font-weight:600; border:1px solid #5c96fb; box-shadow:0 1px 0 rgba(255,255,255,.15) inset, 0 8px 20px -8px rgba(79,140,247,.7); transition:all .15s ease;}

.btn-ghost{background:var(--ink-700); border:1px solid var(--line); color:var(--text-hi); transition:all .15s ease;}
.btn-ghost:hover{background:var(--ink-600); border-color:#3a4457;}
.chip{font-family:var(--font-mono); font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--line);}
.nav-item{transition:all .15s ease; cursor:pointer;}
.nav-item:hover{background:var(--ink-700);}
.nav-item.active{background:rgba(79,140,247,.12); border-left:3px solid var(--py-blue);}
.traffic{width:10px;height:10px;border-radius:50%;display:inline-block;}
table.console-table thead th{background:var(--ink-700); color:var(--text-dim); font-family:var(--font-mono); font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; padding:12px 16px; text-align:left; border-bottom:1px solid var(--line);}

table.console-table tbody tr{transition:background .12s ease;}

const swalTheme = { background:'#131922', color:'#eef2f8', confirmButtonColor:'#4f8cf7', cancelButtonColor:'#232b38' };

function AdminDashboard() {
    const [isAuthenticated, setIsAuthenticated] = useState(false);
    const [username, setUsername] = useState('');
    const [password, setPassword] = useState('');
    const [results, setResults] = useState([]);
    const [activeSessions, setActiveSessions] = useState([]);
    const [selectedStudent, setSelectedStudent] = useState(null);
    const [showDetailedAnswers, setShowDetailedAnswers] = useState(false);
    const [resultFilter, setResultFilter] = useState('all');
    const [filterStatus, setFilterStatus] = useState('all');
    const [filterClasse, setFilterClasse] = useState('all');
    const [sidebarOpen, setSidebarOpen] = useState(true);

    useEffect(() => {
        if (isAuthenticated) {
            const u1 = db.collection('results').orderBy('timestamp','desc').onSnapshot(snap => {
                setResults(snap.docs.map(d => ({ id:d.id, ...d.data() })));
            });
            const u2 = db.collection('quiz_sessions').where('status','in',['started']).onSnapshot(snap => {
                setActiveSessions(snap.docs.map(d => ({ id:d.id, ...d.data() })));
            });
            return () => { u1(); u2(); };
        }
    }, [isAuthenticated]);

    const handleLogin = () => {
        if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
            setIsAuthenticated(true);
            Swal.fire({ ...swalTheme, icon:'success', title:'Connexion réussie', text:'Bienvenue dans la console', timer:1800, showConfirmButton:false });
        } else {
            Swal.fire({ ...swalTheme, icon:'error', title:'Identifiants incorrects', text:"Vérifiez vos identifiants" });
        }
    };

    const handleLogout = () => {
        Swal.fire({ ...swalTheme, icon:'question', title:'Déconnexion', text:'Voulez-vous vous déconnecter ?', showCancelButton:true, confirmButtonText:'Oui', cancelButtonText:'Annuler' })
            .then(r => { if (r.isConfirmed) { setIsAuthenticated(false); setUsername(''); setPassword(''); } });
    };

    const exportToCSV = () => {
        const headers = ['Nom','Classe','Note/20','Pourcentage','Bonnes réponses','Total','Points','Max points','Triche','Pénalité','Date'];
        const rows = results.map(r => [r.etudiant,r.classe,r.note,r.pourcentage+'%',r.correct,r.total,r.points,r.maxPoints,r.tentativesTriche,r.penalite||0,r.dateTest]);
        const csv = '\uFEFF' + [headers,...rows].map(row=>row.join(',')).join('\n');
        const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download=`resultats_quiz_${new Date().toISOString().split('T')[0]}.csv`; a.click();
    };

    const clearAllResults = async () => {
        const r = await Swal.fire({
            ...swalTheme, icon:'warning', title:'Attention !',
            html:`<p class="text-base font-semibold mb-2" style="color:#eef2f8">Êtes-vous sûr ?</p><p style="color:#a9b3c4">Suppression de <strong>${results.length} résultats</strong></p><p style="color:#ff6b6b" class="text-sm mt-2">Action irréversible !</p>`,
            showCancelButton:true, confirmButtonText:'Oui, supprimer tout', cancelButtonText:'Annuler', confirmButtonColor:'#ff6b6b'
        });
        if (r.isConfirmed) {
            try {
                const batch = db.batch();
                const snap = await db.collection('results').get();
                snap.docs.forEach(d => batch.delete(d.ref));
                await batch.commit();
                Swal.fire({ ...swalTheme, icon:'success', title:'Supprimé !', text:'Tous les résultats ont été effacés', timer:2000, showConfirmButton:false });
            } catch(e) { Swal.fire({ ...swalTheme, icon:'error', title:'Erreur', text:'Impossible de supprimer les résultats' }); }
        }
    };

    const calculateStats = () => {
        if (results.length === 0) return { total:0, moyenne:0, tauxReussite:0, tentativesTriche:0 };
        const total = results.length;
        const moyenne = (results.reduce((acc,r) => acc+parseFloat(r.note),0)/total).toFixed(2);
        const admis = results.filter(r => parseFloat(r.note) >= 10).length;
        const tauxReussite = ((admis/total)*100).toFixed(2);
        const tentativesTriche = results.reduce((acc,r) => acc+(r.tentativesTriche||0),0);
        return { total, moyenne, tauxReussite, tentativesTriche };
    };

    const filteredResults = results.filter(r => {
        const sm = filterStatus==='all'||(filterStatus==='admis'&&parseFloat(r.note)>=10)||(filterStatus==='echec'&&parseFloat(r.note)<10)||(filterStatus==='triche'&&r.tentativesTriche>0);
        const cm = filterClasse==='all'||r.classe===filterClasse;
        return sm && cm;
    });

    // ── CONNEXION ────────────────────────────────────────────────
    if (!isAuthenticated) {
        return (
            <div className="min-h-screen flex items-center justify-center p-4">
                <div className="ide-card w-full max-w-md fade-up overflow-hidden">
                    <div className="px-5 py-3.5 flex items-center gap-2" style={{background:'var(--ink-700)', borderBottom:'1px solid var(--line)'}}>
                        <span className="traffic" style={{background:'#ff6b6b'}}></span>
                        <span className="traffic" style={{background:'#ffc94d'}}></span>
                        <span className="traffic" style={{background:'#57d38c'}}></span>
                        <span className="font-mono text-xs ml-3" style={{color:'var(--text-dim)'}}>admin_login.py</span>
                    </div>
                    <div className="p-8">
                        <div className="text-center mb-7">
                            <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4 p-2" style={{background:'#f4f6fb', border:'1px solid var(--line)'}}>
                                <img src="isi_logo.png" alt="ISI Keur Massar" className="w-full h-full object-contain" />
                            </div>
                            <h1 className="font-display text-2xl font-bold" style={{color:'var(--text-hi)'}}>Console Admin</h1>
                            <p className="font-mono text-xs mt-1" style={{color:'var(--text-dim)'}}>Quiz Python — ISI Keur Massar</p>
                        </div>
                        <div className="space-y-4">
                            <div>
                                <label className="block font-mono text-xs mb-1.5" style={{color:'var(--text-dim)'}}><i className="fas fa-user mr-1.5"></i>utilisateur</label>
                                <input type="text" value={username} onChange={e=>setUsername(e.target.value)} onKeyPress={e=>e.key==='Enter'&&handleLogin()}
                                    className="field w-full px-4 py-3 rounded-lg text-sm" placeholder="identifiant" />
                            </div>
                            <div>
                                <label className="block font-mono text-xs mb-1.5" style={{color:'var(--text-dim)'}}><i className="fas fa-lock mr-1.5"></i>mot de passe</label>
                                <input type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyPress={e=>e.key==='Enter'&&handleLogin()}
                                    className="field w-full px-4 py-3 rounded-lg text-sm" placeholder="mot de passe" />
                            </div>
                            <button onClick={handleLogin} className="btn-primary w-full py-3.5 rounded-lg text-sm flex items-center justify-center gap-2">
                                <i className="fas fa-right-to-bracket"></i>Se connecter
                            </button>
                        </div>
                        <div className="mt-6 pt-5 text-center" style={{borderTop:'1px solid var(--line)'}}>
                            <a href="index.html" className="font-mono text-xs hover:underline" style={{color:'var(--text-dim)'}}><i className="fas fa-arrow-left mr-1"></i>retour au quiz</a>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    const stats = calculateStats();

    // ── TABLEAU DE BORD ──────────────────────────────────────────
    return (
        <div className="flex min-h-screen">
            <div className={`${sidebarOpen?'w-64':'w-20'} sidebar-desktop transition-all duration-300 fixed h-full z-20`} style={{background:'var(--ink-800)', borderRight:'1px solid var(--line)'}}>
                <div className="p-5">
                    <div className="flex items-center justify-between mb-8">
                        {sidebarOpen ? (
                            <div className="flex items-center gap-2.5">
                                <div className="w-9 h-9 rounded-lg flex items-center justify-center p-1 flex-shrink-0" style={{background:'#f4f6fb', border:'1px solid var(--line)'}}>
                                    <img src="isi_logo.png" alt="ISI Keur Massar" className="w-full h-full object-contain" />
                                </div>
                                <div>
                                    <p className="font-display font-bold text-lg leading-tight" style={{color:'var(--text-hi)'}}>Console</p>
                                    <p className="font-mono text-[11px]" style={{color:'var(--text-dim)'}}>ISI Keur Massar</p>
                                </div>
                            </div>
                        ) : (
                            <div className="w-9 h-9 rounded-lg flex items-center justify-center p-1" style={{background:'#f4f6fb', border:'1px solid var(--line)'}}>
                                <img src="isi_logo.png" alt="ISI Keur Massar" className="w-full h-full object-contain" />
                            </div>
                        )}
                        <button onClick={()=>setSidebarOpen(!sidebarOpen)} className="p-2 rounded-lg btn-ghost">
                            <i className={`fas fa-${sidebarOpen?'angles-left':'angles-right'} text-sm`}></i>
                        </button>
                    </div>
                    <nav className="space-y-1.5 font-mono text-sm">
                        <div className="nav-item active px-3.5 py-2.5 rounded-lg flex items-center gap-3" style={{color:'var(--text-hi)'}}>
                            <i className="fas fa-chart-line w-4" style={{color:'var(--py-blue)'}}></i>{sidebarOpen&&<span>statistiques</span>}
                        </div>
                        <div onClick={exportToCSV} className="nav-item px-3.5 py-2.5 rounded-lg flex items-center gap-3" style={{color:'var(--text-mid)'}}>
                            <i className="fas fa-file-export w-4"></i>{sidebarOpen&&<span>exporter_csv()</span>}
                        </div>
                        <div onClick={clearAllResults} className="nav-item px-3.5 py-2.5 rounded-lg flex items-center gap-3" style={{color:'var(--text-mid)'}}>
                            <i className="fas fa-trash w-4"></i>{sidebarOpen&&<span>effacer_tout()</span>}
                        </div>
                        <div onClick={handleLogout} className="nav-item px-3.5 py-2.5 rounded-lg flex items-center gap-3" style={{color:'#ff6b6b'}}>
                            <i className="fas fa-right-from-bracket w-4"></i>{sidebarOpen&&<span>deconnexion()</span>}
                        </div>
                    </nav>
                </div>
            </div>

            <div className={`flex-1 ${sidebarOpen?'lg:ml-64':'lg:ml-20'} transition-all duration-300`}>
                <main className="p-4 md:p-8">
                    <div className="mb-7 flex items-center justify-between flex-wrap gap-3">
                        <div>
                            <h1 className="font-display text-2xl md:text-3xl font-bold" style={{color:'var(--text-hi)'}}>Tableau de Bord</h1>
                            <p className="font-mono text-xs mt-1" style={{color:'var(--text-dim)'}}>Quiz Python ISI Keur Massar — gestion des résultats</p>
                        </div>
                        <div className="flex items-center gap-2 font-mono text-xs">
                            <span className="pulse-dot inline-block w-2 h-2 rounded-full" style={{background:'var(--ok)'}}></span>
                            <span style={{color:'var(--text-dim)'}}>connecté en temps réel</span>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                        {[
                            {label:'Total étudiants', value:stats.total, icon:'fa-users', color:'var(--py-blue)'},
                            {label:'Moyenne générale', value:stats.moyenne, icon:'fa-chart-line', color:'var(--ok)'},
                            {label:'Taux de réussite', value:stats.tauxReussite+'%', icon:'fa-percent', color:'var(--purple)'},
                            {label:'Tentatives triche', value:stats.tentativesTriche, icon:'fa-triangle-exclamation', color:'var(--bad)'},
                        ].map((s,i) => (
                            <div key={i} className="ide-card p-5">
                                <div className="flex items-center justify-between mb-3">
                                    <div className="w-11 h-11 rounded-xl flex items-center justify-center" style={{background:'var(--ink-900)', border:'1px solid var(--line)'}}>
                                        <i className={`fas ${s.icon}`} style={{color:s.color}}></i>
                                    </div>
                                    <span className="font-display text-2xl font-bold" style={{color:'var(--text-hi)'}}>{s.value}</span>
                                </div>
                                <h3 className="font-mono text-[11px]" style={{color:'var(--text-dim)'}}>{s.label}</h3>
                            </div>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
                        <div className="ide-card p-5">
                            <h3 className="font-mono text-xs mb-4" style={{color:'var(--text-dim)'}}><i className="fas fa-graduation-cap mr-2" style={{color:'var(--py-blue)'}}></i>PAR CLASSE</h3>
                            <div className="space-y-2 max-h-48 overflow-y-auto">
                                {CLASSES.map(c => (
                                    <div key={c} className="flex justify-between items-center font-mono text-sm">
                                        <span style={{color:'var(--text-mid)'}}>{c}</span>
                                        <span className="font-bold" style={{color:'var(--py-blue)'}}>{results.filter(r=>r.classe===c).length}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="ide-card p-5">
                            <h3 className="font-mono text-xs mb-4" style={{color:'var(--text-dim)'}}><i className="fas fa-trophy mr-2" style={{color:'var(--py-yellow)'}}></i>RÉSULTATS</h3>
                            <div className="space-y-3 font-mono text-sm">
                                <div className="flex justify-between items-center"><span style={{color:'var(--text-mid)'}}>Admis (≥10)</span><span className="font-bold" style={{color:'var(--ok)'}}>{results.filter(r=>parseFloat(r.note)>=10).length}</span></div>
                                <div className="flex justify-between items-center"><span style={{color:'var(--text-mid)'}}>Échec (&lt;10)</span><span className="font-bold" style={{color:'var(--bad)'}}>{results.filter(r=>parseFloat(r.note)<10).length}</span></div>
                            </div>
                        </div>
                        <div className="ide-card p-5">
                            <h3 className="font-mono text-xs mb-4" style={{color:'var(--text-dim)'}}><i className="fas fa-star mr-2" style={{color:'var(--purple)'}}></i>PERFORMANCES</h3>
                            <div className="space-y-3 font-mono text-sm">
                                <div className="flex justify-between items-center"><span style={{color:'var(--text-mid)'}}>Note max</span><span className="font-bold" style={{color:'var(--ok)'}}>{results.length>0?Math.max(...results.map(r=>parseFloat(r.note))).toFixed(2):'0'}/20</span></div>
                                <div className="flex justify-between items-center"><span style={{color:'var(--text-mid)'}}>Note min</span><span className="font-bold" style={{color:'var(--bad)'}}>{results.length>0?Math.min(...results.map(r=>parseFloat(r.note))).toFixed(2):'0'}/20</span></div>
                            </div>
                        </div>
                    </div>

                    {activeSessions.length > 0 && (
                        <div className="ide-card p-5 mb-6" style={{borderColor:'#245c3c'}}>
                            <h3 className="font-mono text-sm mb-4 flex items-center" style={{color:'var(--text-hi)'}}>
                                <span className="pulse-dot inline-block w-2.5 h-2.5 rounded-full mr-3" style={{background:'var(--ok)'}}></span>
                                sessions_en_cours({activeSessions.length})
                                <span className="ml-3 chip" style={{color:'var(--ok)',borderColor:'#245c3c',background:'rgba(87,211,140,.1)'}}>EN DIRECT</span>
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                {activeSessions.map(s => (
                                    <div key={s.id} className="rounded-xl p-4" style={{background:'var(--ink-900)', borderLeft:'3px solid var(--ok)'}}>
                                        <div className="flex items-center mb-2">
                                            <div className="w-9 h-9 rounded-full flex items-center justify-center mr-3" style={{background:'var(--py-blue-dim)'}}><i className="fas fa-user text-xs" style={{color:'#dfeaff'}}></i></div>
                                            <div><p className="font-semibold text-sm" style={{color:'var(--text-hi)'}}>{s.etudiant}</p><p className="font-mono text-[11px]" style={{color:'var(--text-dim)'}}>{s.classe}</p></div>
                                        </div>
                                        <div className="flex justify-between font-mono text-xs">
                                            <span style={{color:'var(--text-dim)'}}>Q {s.currentQuestion}/70</span>
                                            {s.tabSwitches>0&&<span className="chip" style={{color:'#ff6b6b',borderColor:'#7a2b2b',background:'rgba(255,107,107,.1)'}}>{s.tabSwitches} ⚠</span>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="ide-card p-5 mb-5">
                        <h3 className="font-mono text-xs mb-4" style={{color:'var(--text-dim)'}}>FILTRES</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block font-mono text-[11px] mb-2" style={{color:'var(--text-dim)'}}>statut</label>
                                <div className="flex flex-wrap gap-2">
                                    {['all','admis','echec','triche'].map(s => (
                                        <button key={s} onClick={()=>setFilterStatus(s)} className="px-3.5 py-1.5 rounded-lg font-mono text-xs border transition-all"
                                            style={filterStatus===s ? {background:'var(--py-blue)', color:'#fff', borderColor:'#5c96fb'} : {background:'var(--ink-900)', color:'var(--text-mid)', borderColor:'var(--line)'}}>
                                            {s==='all'?'tous':s==='admis'?'admis':s==='echec'?'échec':'triche'}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <label className="block font-mono text-[11px] mb-2" style={{color:'var(--text-dim)'}}>classe</label>
                                <div className="flex flex-wrap gap-2">
                                    <button onClick={()=>setFilterClasse('all')} className="px-3.5 py-1.5 rounded-lg font-mono text-xs border transition-all"
                                        style={filterClasse==='all' ? {background:'var(--py-blue)', color:'#fff', borderColor:'#5c96fb'} : {background:'var(--ink-900)', color:'var(--text-mid)', borderColor:'var(--line)'}}>toutes</button>
                                    {CLASSES.map(c => (
                                        <button key={c} onClick={()=>setFilterClasse(c)} className="px-3.5 py-1.5 rounded-lg font-mono text-xs border transition-all"
                                            style={filterClasse===c ? {background:'var(--py-blue)', color:'#fff', borderColor:'#5c96fb'} : {background:'var(--ink-900)', color:'var(--text-mid)', borderColor:'var(--line)'}}>{c}</button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="ide-card overflow-hidden">
                        <div className="px-5 py-4 flex items-center justify-between" style={{background:'var(--ink-700)', borderBottom:'1px solid var(--line)'}}>
                            <h3 className="font-mono text-sm" style={{color:'var(--text-hi)'}}><i className="fas fa-table mr-2" style={{color:'var(--py-blue)'}}></i>résultats_étudiants ({filteredResults.length})</h3>
                        </div>
                        {filteredResults.length === 0 ? (
                            <div className="p-14 text-center">
                                <i className="fas fa-inbox text-5xl mb-4" style={{color:'var(--text-dim)'}}></i>
                                <p className="font-mono text-sm" style={{color:'var(--text-mid)'}}>Aucun résultat disponible</p>
                                <p className="font-mono text-xs mt-2" style={{color:'var(--text-dim)'}}>Les résultats apparaîtront ici après soumission des quiz</p>
                            </div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full console-table">
                                    <thead><tr>{['Étudiant','Classe','Note','Performance','Surveillance','Date','Actions'].map((h,i) => <th key={i}>{h}</th>)}</tr></thead>
                                    <tbody>
                                        {filteredResults.map((result,index) => (
                                            <tr key={index}>
                                                <td>
                                                    <div className="flex items-center">
                                                        <div className="w-9 h-9 rounded-full flex items-center justify-center mr-3" style={{background:'var(--py-blue-dim)'}}><i className="fas fa-user text-xs" style={{color:'#dfeaff'}}></i></div>
                                                        <span className="font-medium text-sm" style={{color:'var(--text-hi)'}}>{result.etudiant}</span>
                                                    </div>
                                                </td>
                                                <td><span className="chip" style={{color:'var(--py-blue)',borderColor:'var(--py-blue-dim)',background:'rgba(79,140,247,.1)'}}>{result.classe}</span></td>
                                                <td>
                                                    <div className="font-display text-lg font-bold" style={{color: parseFloat(result.note)>=10?'var(--ok)':'var(--bad)'}}>{result.note}/20</div>
                                                    <div className="font-mono text-[11px]" style={{color:'var(--text-dim)'}}>{result.correct}/{result.total} bonnes</div>
                                                </td>
                                                <td>
                                                    <div className="w-28">
                                                        <div className="w-full h-2 rounded-full overflow-hidden progress-track">
                                                            <div className="h-full rounded-full" style={{width:`${result.pourcentage}%`, background:'linear-gradient(90deg,#4f8cf7,#57d38c)'}}></div>
                                                        </div>
                                                        <div className="font-mono text-[10px] mt-1" style={{color:'var(--text-dim)'}}>{result.pourcentage}%</div>
                                                    </div>
                                                </td>
                                                <td>
                                                    {result.tentativesTriche>0
                                                        ? <span className="font-mono text-xs font-bold" style={{color:'var(--bad)'}}><i className="fas fa-triangle-exclamation mr-1"></i>{result.tentativesTriche} fois</span>
                                                        : <span className="font-mono text-xs" style={{color:'var(--ok)'}}><i className="fas fa-check mr-1"></i>aucune</span>}
                                                </td>
                                                <td className="font-mono text-xs" style={{color:'var(--text-dim)'}}><i className="far fa-clock mr-1"></i>{result.dateTest}</td>
                                                <td>
                                                    <button onClick={()=>setSelectedStudent(result)} className="font-mono text-xs font-bold hover:underline" style={{color:'var(--py-blue)'}}>
                                                        <i className="fas fa-eye mr-1"></i>détails
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </main>
            </div>

            {selectedStudent && (
                <div className="fixed inset-0 flex items-center justify-center p-3 md:p-4 z-50" style={{background:'rgba(5,7,11,.75)', backdropFilter:'blur(4px)'}}>
                    <div className="ide-card max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col">
                        <div className="px-5 md:px-6 py-4 flex justify-between items-start flex-shrink-0" style={{background:'var(--ink-700)', borderBottom:'1px solid var(--line)'}}>
                            <div>
                                <h2 className="font-display text-xl md:text-2xl font-bold" style={{color:'var(--text-hi)'}}>{selectedStudent.etudiant}</h2>
                                <p className="font-mono text-xs mt-1" style={{color:'var(--text-dim)'}}>{selectedStudent.classe}</p>
                            </div>
                            <button onClick={()=>{setSelectedStudent(null);setShowDetailedAnswers(false);}} className="btn-ghost w-9 h-9 rounded-lg flex items-center justify-center">
                                <i className="fas fa-xmark"></i>
                            </button>
                        </div>
                        <div className="p-5 md:p-7 overflow-y-auto">
                            <div className="text-center mb-7">
                                <div className="inline-flex items-baseline justify-center gap-1 rounded-2xl px-8 py-5" style={{background: parseFloat(selectedStudent.note)>=10 ? 'rgba(87,211,140,.12)' : 'rgba(255,107,107,.12)', border: `1px solid ${parseFloat(selectedStudent.note)>=10?'#245c3c':'#7a2b2b'}`}}>
                                    <span className="font-display text-5xl md:text-6xl font-bold" style={{color: parseFloat(selectedStudent.note)>=10?'var(--ok)':'var(--bad)'}}>{selectedStudent.note}</span>
                                    <span className="text-2xl" style={{color:'var(--text-dim)'}}>/20</span>
                                </div>
                                <p className="font-mono text-sm mt-3" style={{color:'var(--text-mid)'}}>{selectedStudent.correct} / {selectedStudent.total} réponses correctes</p>
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-7">
                                {[
                                    {label:'Réussite', value:selectedStudent.pourcentage+'%', color:'var(--py-blue)'},
                                    {label:'Correctes', value:selectedStudent.correct, color:'var(--ok)'},
                                    {label:'Durée', value:selectedStudent.duree||'N/A', color:'var(--purple)'},
                                    {label:'Triches', value:selectedStudent.tentativesTriche, color:'var(--bad)'},
                                ].map((s,i) => (
                                    <div key={i} className="rounded-xl p-4 text-center" style={{background:'var(--ink-900)', border:'1px solid var(--line)'}}>
                                        <div className="font-display text-xl font-bold" style={{color:s.color}}>{s.value}</div>
                                        <div className="font-mono text-[10px] mt-1" style={{color:'var(--text-dim)'}}>{s.label}</div>
                                    </div>
                                ))}
                            </div>

                            {showDetailedAnswers && selectedStudent.detailsReponses && (() => {
                                const correct = selectedStudent.detailsReponses.filter(r=>r.estCorrecte);
                                const incorrect = selectedStudent.detailsReponses.filter(r=>!r.estCorrecte&&r.reponse!==-1);
                                const unanswered = selectedStudent.detailsReponses.filter(r=>r.reponse===-1);
                                const lists = {all:selectedStudent.detailsReponses, ok:correct, fail:incorrect, skip:unanswered};
                                const list = lists[resultFilter] || lists.all;
                                return (
                                    <div className="space-y-3 mb-4">
                                        <div className="flex flex-wrap gap-2">
                                            {[{k:'all',label:`Toutes (${selectedStudent.detailsReponses.length})`},{k:'ok',label:`Réussies (${correct.length})`},{k:'fail',label:`Échouées (${incorrect.length})`},{k:'skip',label:`Ignorées (${unanswered.length})`}].map(f => (
                                                <button key={f.k} onClick={()=>setResultFilter(f.k)} className="px-3.5 py-1.5 rounded-full font-mono text-xs border transition-all"
                                                    style={resultFilter===f.k ? {background:'var(--py-blue)', color:'#fff', borderColor:'#5c96fb'} : {background:'var(--ink-900)', color:'var(--text-dim)', borderColor:'var(--line)'}}>{f.label}</button>
                                            ))}
                                        </div>
                                        {list.map(detail => {
                                            const skipped = detail.reponse === -1;
                                            const cls = skipped ? 'assert-skip' : detail.estCorrecte ? 'assert-ok' : 'assert-fail';
                                            return (
                                                <div key={detail.question} className={`rounded-xl p-4 ${cls}`} style={{background:'var(--ink-900)'}}>
                                                    <div className="flex justify-between items-center mb-2">
                                                        <span className="font-mono text-xs" style={{color:'var(--text-dim)'}}>test_question_{detail.question}</span>
                                                        <span className="font-mono text-xs font-bold" style={{color: skipped?'var(--text-dim)':detail.estCorrecte?'var(--ok)':'var(--bad)'}}>
                                                            {skipped ? 'SKIPPED' : detail.estCorrecte ? `PASSED +${detail.points}pt` : 'FAILED'}
                                                        </span>
                                                    </div>
                                                    <p className="text-sm mb-2" style={{color:'var(--text-mid)'}}>{detail.questionText}</p>
                                                    <div className="rounded-lg p-3 mb-2 overflow-x-auto" style={{background:'var(--ink-950)'}}>
                                                        <pre className="font-mono text-xs" style={{color:'var(--text-hi)'}}>{detail.code}</pre>
                                                    </div>
                                                    <div className="font-mono text-xs space-y-1">
                                                        {!skipped && <div style={{color: detail.estCorrecte?'var(--ok)':'var(--bad)'}}>votre réponse → {detail.reponseText}</div>}
                                                        {!detail.estCorrecte && <div style={{color:'var(--ok)'}}>attendu → {detail.correctText}</div>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                );
                            })()}

                            <div className="flex flex-col sm:flex-row gap-3">
                                <button onClick={()=>setShowDetailedAnswers(!showDetailedAnswers)} className="btn-primary flex-1 py-3.5 rounded-lg text-sm flex items-center justify-center gap-2">
                                    <i className={`fas ${showDetailedAnswers?'fa-eye-slash':'fa-list-check'}`}></i>{showDetailedAnswers?'Masquer':'Voir'} les détails
                                </button>
                                <button onClick={() => {
                                    const rpt = `=== RAPPORT DÉTAILLÉ ===\n\nÉtudiant: ${selectedStudent.etudiant}\nClasse: ${selectedStudent.classe}\nNote: ${selectedStudent.note}/20\nRéussite: ${selectedStudent.pourcentage}%\nRéponses correctes: ${selectedStudent.correct}/${selectedStudent.total}\nDurée: ${selectedStudent.duree}\nTentatives triche: ${selectedStudent.tentativesTriche}\nDate: ${selectedStudent.dateTest}`;
                                    const blob = new Blob([rpt], {type:'text/plain;charset=utf-8;'});
                                    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`rapport_${selectedStudent.etudiant.replace(/\s+/g,'_')}.txt`; a.click();
                                }} className="btn-ghost flex-1 py-3.5 rounded-lg text-sm flex items-center justify-center gap-2">
                                    <i className="fas fa-file-export"></i>Exporter
                                </button>
                                <button onClick={()=>{setSelectedStudent(null);setShowDetailedAnswers(false);}} className="btn-ghost px-7 py-3.5 rounded-lg text-sm">Fermer</button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AdminDashboard />);
</script>
</body>
</html>
